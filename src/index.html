<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
  <meta charset="utf-8" />
  <title>blinker App</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f7f9fc" />
  <script>
    try {
      const theme = localStorage.getItem('blinker-theme') === 'dark' ? 'dark' : 'light';
      document.documentElement.classList.add(theme);
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="color-scheme"]').content = theme;
      document.querySelector('meta[name="theme-color"]').content =
        theme === 'dark' ? '#071b2e' : '#f7f9fc';
    } catch (_) {
      document.documentElement.classList.add('light');
    }
  </script>
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <link rel="icon" type="image/png" href="icons/icon-72x72.png" />
  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <!-- Font-awesome 6 -->
  <link rel="stylesheet" href="fontawesome6/css/all.min.css" />
  <!-- blinker font -->
  <link rel="stylesheet" href="ownfonts/iconfont.css">

  <!-- PWA support -->
  <!-- <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1976d2"> -->
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
