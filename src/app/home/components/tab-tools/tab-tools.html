<ion-header class="main-tab-header tools-header">
  <ion-toolbar>
    <ion-title>工具</ion-title>

    <ion-buttons slot="end">
      <ion-button
        class="header-action"
        fill="clear"
        aria-label="最近使用"
        [class.active]="recentOnly"
        (click)="toggleRecent()"
      >
        <i class="fa-light fa-clock-rotate-left"></i>
      </ion-button>
      <ion-button
        class="header-action"
        fill="clear"
        aria-label="搜索工具"
        [class.active]="searchVisible"
        (click)="toggleSearch()"
      >
        <i class="fa-light fa-magnifying-glass"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="tools-page">
    @if (searchVisible) {
      <label class="search-box">
        <i class="fa-light fa-magnifying-glass"></i>
        <input
          type="search"
          inputmode="search"
          autocomplete="off"
          placeholder="搜索工具"
          [(ngModel)]="searchKeyword"
        />
        @if (searchKeyword) {
          <button type="button" aria-label="清除搜索" (click)="searchKeyword = ''">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        }
      </label>
    }

    @for (group of visibleGroups; track group.title) {
      <section class="tool-section">
        <h2>{{ group.title }}</h2>
        <div class="tool-list">
          @for (tool of group.tools; track tool.title) {
            <button
              class="tool-row"
              type="button"
              [class.planned]="!tool.route"
              (click)="openTool(tool)"
            >
              <span class="tool-icon" aria-hidden="true">
                <i [class]="'fa-light ' + tool.icon"></i>
              </span>
              <span class="tool-copy">
                <span class="tool-title">{{ tool.title }}</span>
                <span class="tool-description">{{ tool.description }}</span>
              </span>
              @if (tool.badge) {
                <span class="tool-badge">{{ tool.badge }}</span>
              }
              <i class="fa-light fa-chevron-right tool-arrow" aria-hidden="true"></i>
            </button>
          }
        </div>
      </section>
    } @empty {
      <div class="empty-state">
        <span><i class="fa-light fa-magnifying-glass"></i></span>
        <h2>{{ recentOnly ? '还没有最近使用的工具' : '没有找到相关工具' }}</h2>
        <p>{{ recentOnly ? '打开工具后会自动记录在这里' : '换个关键词试试看' }}</p>
      </div>
    }
  </div>
</ion-content>
