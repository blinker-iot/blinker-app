<ion-header class="main-tab-header">
  <ion-toolbar>
    <ion-title>{{ 'NAVIGATION.TOOLS' | translate }}</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div slot="fixed" class="top-scroll-mask" aria-hidden="true"></div>

  <div class="tools-page">
    @for (group of groups; track group.title) {
      <section class="tool-section">
        <h2>{{ group.title }}</h2>
        <app-menu-list
          [items]="group.tools"
          [detailed]="true"
          (itemSelected)="openTool($event)"
        ></app-menu-list>
      </section>
    }
  </div>
</ion-content>
