<ion-header class="main-tab-header home-tab-header">
  <ion-toolbar>
    <ion-title>{{ 'NAVIGATION.TOOLS' | translate }}</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div slot="fixed" class="top-scroll-mask" aria-hidden="true"></div>

  <div class="tools-page">
    @for (group of groups; track group.title; let groupIndex = $index) {
      <section class="tool-section" [attr.aria-labelledby]="'tools-group-' + groupIndex">
        <h2 [id]="'tools-group-' + groupIndex">{{ group.title }}</h2>
        <app-menu-list
          appearance="settings"
          [items]="group.tools"
          (itemSelected)="openTool($event)"
        ></app-menu-list>
      </section>
    }
  </div>
</ion-content>
