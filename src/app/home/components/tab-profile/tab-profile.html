<ion-header whitebg class="main-tab-header profile-header">
  <ion-toolbar>
    <ion-title>用户中心</ion-title>
    <ion-buttons slot="end">
      <ion-button class="header-action" aria-label="设置" (click)="goto('/settings')">
        <i class="fa-light fa-gear"></i>
      </ion-button>
      <ion-button class="header-action" aria-label="消息中心" (click)="goto('/message')">
        <i class="fa-light fa-message-dots"></i>
        <span class="notice-dot"></span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <div class="profile-content">
    <button type="button" class="user-info" (click)="goto('/user')">
      <div class="avatar">
        @if (avatar) {
        <img [src]="avatar" alt="用户头像" />
        } @else {
        <span>{{ userName.slice(0, 1) }}</span>
        }
      </div>
      <div class="info">
        <div class="name">{{ userName }}</div>
        <div class="membership">点灯用户</div>
      </div>
      <i class="fa-light fa-chevron-right profile-arrow"></i>
    </button>

    <section class="summary-grid" aria-label="账户概览">
      <button type="button" (click)="goto('/room-manager')">
        <i class="fa-light fa-house"></i>
        <span class="summary-label">家庭</span>
        <strong>{{ roomNum }} <small>个</small></strong>
      </button>
      <button type="button">
        <i class="fa-light fa-server"></i>
        <span class="summary-label">设备</span>
        <strong>{{ deviceNum }} <small>台</small></strong>
      </button>
      <button type="button" (click)="goto('/message')">
        <i class="fa-light fa-message-lines"></i>
        <span class="summary-label">消息</span>
        <strong>4 <small>条</small></strong>
        <span class="summary-dot"></span>
      </button>
    </section>

    <section class="menu-card">
      <button type="button" class="menu-item" (click)="goto('/room-manager')">
        <span class="menu-icon"><i class="fa-light fa-house"></i></span>
        <span class="menu-label">家庭管理</span>
        <span class="menu-value">{{ roomNum }} 个家庭</span>
        <i class="fa-light fa-chevron-right"></i>
      </button>
      <button type="button" class="menu-item" (click)="goto('/scene-manager')">
        <span class="menu-icon"><i class="fa-light fa-bullseye-pointer"></i></span>
        <span class="menu-label">自动化</span>
        <span class="menu-value">{{ sceneNum }} 个场景</span>
        <i class="fa-light fa-chevron-right"></i>
      </button>
      <button type="button" class="menu-item">
        <span class="menu-icon"><i class="fa-light fa-user-group"></i></span>
        <span class="menu-label">设备共享</span>
        <span class="menu-value">已共享 {{ sharedDeviceNum }} 台设备</span>
        <i class="fa-light fa-chevron-right"></i>
      </button>
      <button type="button" class="menu-item">
        <span class="menu-icon"><i class="fa-light fa-microphone"></i></span>
        <span class="menu-label">语音助手</span>
        <span class="menu-value">小度、天猫精灵</span>
        <i class="fa-light fa-chevron-right"></i>
      </button>
    </section>

    <section class="menu-card compact-card">
      <button type="button" class="menu-item" (click)="goto('/settings')">
        <span class="menu-icon"><i class="fa-light fa-gear"></i></span>
        <span class="menu-label">设置</span>
        <i class="fa-light fa-chevron-right"></i>
      </button>
      <button type="button" class="menu-item">
        <span class="menu-icon"><i class="fa-light fa-circle-question"></i></span>
        <span class="menu-label">帮助与反馈</span>
        <i class="fa-light fa-chevron-right"></i>
      </button>
      <button type="button" class="menu-item logout-item" (click)="logout()">
        <span class="menu-icon"><i class="fa-light fa-arrow-right-from-bracket"></i></span>
        <span class="menu-label">退出登录</span>
      </button>
    </section>

    <div class="profile-version">
      <span>版本 {{ currentVersion || '2.4.1' }}</span>
      @if (showNewVersion) {
      <span class="version-dot"></span>
      }
    </div>

  </div>
</ion-content>
