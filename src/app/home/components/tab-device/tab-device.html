<ion-header whitebg class="main-tab-header device-header">
  <ion-toolbar>
    <ion-title>设备</ion-title>
    <ion-buttons slot="end">
      <ion-button class="header-action notice-button" aria-label="消息中心" [routerLink]="['/message']">
        <i class="fa-light fa-bell"></i>
      </ion-button>
      <ion-button
        #deviceAddMenuTrigger
        id="device-add-menu-trigger"
        class="header-action add-button"
        aria-label="打开添加菜单"
        aria-haspopup="menu"
      >
        <i class="fa-light fa-plus"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content #deviceContent fullscreen="true">
  <div slot="fixed" class="top-scroll-mask" aria-hidden="true"></div>

  <div slot="fixed" class="room-list-fixed">
    <room-list [(roomid)]="roomid" (roomidChange)="onRoomidChange($event)"></room-list>
  </div>

  <div class="device-page">
    @if (deviceNum > 0) {
    <div class="device-zone">
      <deviceblock-zone
        [(roomid)]="roomid"
      ></deviceblock-zone>
    </div>
    } @else {
    <div class="empty-devices">
      <div class="empty-icon"><i class="fa-light fa-house-signal"></i></div>
      <h2>还没有设备</h2>
      <p>添加你的第一台智能设备，开始轻松生活</p>
      <button type="button" [routerLink]="['/adddevice']">
        <i class="fa-light fa-plus"></i>
        添加设备
      </button>
    </div>
    }
  </div>
</ion-content>

<ion-popover
  #deviceAddMenu
  class="device-add-popover"
  trigger="device-add-menu-trigger"
  triggerAction="click"
  reference="trigger"
  side="bottom"
  alignment="end"
  [dismissOnSelect]="false"
  [showBackdrop]="true"
  (willPresent)="scheduleAddMenuPosition()"
  (didPresent)="scheduleAddMenuPosition()"
>
  <ng-template>
    <nav class="device-add-menu" role="menu" aria-label="添加">
      <button type="button" role="menuitem" (click)="openAddPage('/adddevice')">
        <span class="menu-icon"><i class="fa-light fa-router"></i></span>
        <span class="menu-copy">
          <strong>添加新设备</strong>
          <small>连接并配置智能设备</small>
        </span>
        <i class="fa-light fa-chevron-right menu-arrow" aria-hidden="true"></i>
      </button>

      <button type="button" role="menuitem" (click)="openAddPage('/room-manager')">
        <span class="menu-icon"><i class="fa-light fa-layer-group"></i></span>
        <span class="menu-copy">
          <strong>添加区域</strong>
          <small>添加设备所在区域</small>
        </span>
        <i class="fa-light fa-chevron-right menu-arrow" aria-hidden="true"></i>
      </button>

      <button type="button" role="menuitem" (click)="showComponentPending()">
        <span class="menu-icon"><i class="fa-light fa-puzzle-piece"></i></span>
        <span class="menu-copy">
          <strong>添加组件</strong>
          <small>自定义设备控制面板</small>
        </span>
        <i class="fa-light fa-chevron-right menu-arrow" aria-hidden="true"></i>
      </button>
    </nav>
  </ng-template>
</ion-popover>
