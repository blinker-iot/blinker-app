<div #refreshZone></div>
<div class="device-list-container" #deviceZone>
  @for (slide of slides; track slide.roomId) {
  <div
    class="room-slide"
    [class.room-slide-current]="slide.role === 'current'"
    [class.room-slide-incoming]="slide.role === 'incoming'"
    [class.room-slide-from-left]="slide.direction === -1"
    [attr.data-room-id]="slide.roomId"
    [attr.aria-hidden]="slide.role === 'incoming' ? 'true' : null"
  >
    <deviceblock-list
      [roomName]="getRoomName(slide.roomId)"
      (swipeEnabled)="swipeEnabledChanged($event)"
      (refresherEnabled)="refresherEnabledChanged($event)"
    >
    </deviceblock-list>
  </div>
  }
</div>
