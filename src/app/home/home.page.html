<ion-tabs>
    <ion-tab tab="device">
        <tab-device></tab-device>
    </ion-tab>

    <ion-tab tab="community">
        <app-tab-community></app-tab-community>
    </ion-tab>

    <ion-tab tab="tools">
        <app-tab-tools></app-tab-tools>
    </ion-tab>

    <ion-tab tab="profile">
        <app-tab-profile></app-tab-profile>
    </ion-tab>

    <ion-tab-bar slot="bottom">
        <ion-tab-button tab="device">
            <i class="fa-light fa-house-chimney"></i>
            <ion-label>{{ 'NAVIGATION.DEVICE' | translate }}</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="community">
            <i class="fa-light fa-compass"></i>
            <ion-label>{{ 'NAVIGATION.COMMUNITY' | translate }}</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="tools">
            <i class="fa-light fa-toolbox"></i>
            <ion-label>{{ 'NAVIGATION.TOOLS' | translate }}</ion-label>
        </ion-tab-button>

        <ion-tab-button tab="profile">
            <i class="fa-light fa-user"></i>
            <ion-label>{{ 'NAVIGATION.PROFILE' | translate }}</ion-label>
        </ion-tab-button>
    </ion-tab-bar>
</ion-tabs>
