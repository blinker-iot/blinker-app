<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" [defaultHref]="defaultBackHref"></ion-back-button>
    </ion-buttons>
    <ion-title>运行日志</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <main>
    @if (status() === 'ready') {
    <section class="availability-card surface-card" role="status">
      <i class="fa-light fa-file-lines" aria-hidden="true"></i>
      <p class="device-name">{{ deviceName() }}</p>
      <h1>运行日志尚未接入</h1>
      <p>当前版本未接入可信的设备运行日志接口，不显示演示记录，也不将状态或采样数据当作操作记录。</p>
    </section>

    <section class="related-data surface-card" aria-label="其他设备数据">
      <h2>查看其他数据</h2>
      <p>以下页面分别展示属性状态变化和周期数值样本，不是用户操作或设备执行日志。仅在你选择后进入。</p>
      <button type="button" class="secondary-action" data-history="storage" (click)="openHistory('storage')">
        <i class="fa-light fa-database" aria-hidden="true"></i> 状态历史
      </button>
      <button type="button" class="secondary-action" data-history="trends" (click)="openHistory('trends')">
        <i class="fa-light fa-chart-line" aria-hidden="true"></i> 在线趋势
      </button>
    </section>
    } @else {
    <section class="availability-card surface-card" role="status">
      <i class="fa-light fa-file-circle-question" aria-hidden="true"></i>
      <h1>{{ unavailableTitle }}</h1>
      <p>{{ unavailableDescription }}</p>
    </section>
    }
  </main>
</ion-content>
