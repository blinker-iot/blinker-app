<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{'MENU.DEVICE_MANAGER' | translate}}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  @if (loaded) {
  <app-menu-list>
    @for (deviceName of deviceDataList; track deviceName) {
    <app-menu-item
      [routerLink]="['/device-manager',deviceName]"
      showArrow="true"
    >
      <div class="img-box">
        <b-device-img
          [filename]="deviceDataDict[deviceName].config.image"
        ></b-device-img>
        @if (deviceDataDict[deviceName].config.mode=='ble') {
        <img class="mode" src="img/icon/ble.png" />
        }
      </div>
      <div class="text-box">
        <div class="name">{{deviceDataDict[deviceName].config.customName}}</div>
        <div class="other">{{deviceName}}</div>
      </div>
    </app-menu-item>
    }
  </app-menu-list>
  }
</ion-content>
