<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" [defaultHref]="defaultBackHref"></ion-back-button>
    </ion-buttons>
    <ion-title>定时功能</ion-title>
    @if (loaded) {
    <ion-buttons slot="end">
      <ion-button aria-label="刷新任务" [disabled]="syncing" (click)="refreshTasks()">
        <i class="fa-light fa-rotate-right" [class.fa-spin]="syncing"></i>
      </ion-button>
    </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loaded) {
  <main>
    <app-hero-card
      iconClass="fa-light fa-timer"
      eyebrow="AUTOMATION"
      [heading]="deviceName"
      description="按时间、循环周期或倒计时自动执行设备动作。"
      [meta]="timerItems.length"
    />

    <button type="button" class="add-task-button primary-action" (click)="addTask()">
      <i class="fa-light fa-calendar-plus"></i>
      新建任务
    </button>

    @if (timerItems.length) {
    <section class="task-list surface-card">
      @for (item of timerItems; track item.routeId) {
      <article
        class="task-row"
        [class.disabled]="!item.enabled"
        [class.timing]="item.type === 'timing'"
        [class.loop]="item.type === 'loop'"
        [class.countdown]="item.type === 'countdown'"
      >
        <button type="button" class="task-main" (click)="editTask(item)">
          <span class="task-type-icon"><i class="fa-light" [class]="'fa-light ' + item.icon"></i></span>
          <span class="task-copy">
            <span class="task-heading">
              <small>{{ item.typeLabel }}</small>
              <strong>{{ item.title }}</strong>
            </span>
            <span class="task-detail">
              <strong>{{ item.action }}</strong>
              <small>{{ item.schedule }}</small>
            </span>
          </span>
          <i class="fa-light fa-chevron-right row-arrow" aria-hidden="true"></i>
        </button>
        <span class="task-toggle" (click)="$event.stopPropagation()">
          <ion-toggle
            [attr.aria-label]="'切换' + item.typeLabel + '状态'"
            [checked]="item.enabled"
            (ionChange)="setTaskEnabled(item, $event.detail.checked)"
          ></ion-toggle>
        </span>
      </article>
      }
    </section>
    } @else {
    <section class="empty-state surface-card">
      <span><i class="fa-light fa-calendar-clock"></i></span>
      <strong>还没有自动任务</strong>
      <p>创建定时、循环或倒计时任务，让设备按计划自动执行。</p>
      <button type="button" class="empty-add" (click)="addTask()">创建第一个任务</button>
    </section>
    }
  </main>
  } @else {
  <div class="loading-state">
    <ion-spinner name="crescent"></ion-spinner>
    <span>正在加载定时功能…</span>
  </div>
  }
</ion-content>
