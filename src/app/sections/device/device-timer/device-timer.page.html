<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{device?.config.customName}} 定时任务</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  @if (loaded) {
  <app-menu-list [editMode]="editMode" [enableSort]="false">
    <!-- <app-menu-item icon="fa-light fa-plus" (click)="addTimingTask()">
      新建任务
    </app-menu-item> -->
    @for (task of timingTasks; track $index) {
    <app-menu-item (enter)="editTimingTask(task)">
      <div class="text-box">
        <div class="name">{{task.tim | minuteToTime }}</div>
        <div class="other">
          {{task.act[0] | actcmd2text:device.id}}
          <span style="margin-left: 10px">{{ task.day | days2text}}</span>
        </div>
      </div>
      <div class="toggle">
        <ion-toggle
          [checked]="task.ena == '1' ? true : false"
          (click)="changeEna(task)"
        ></ion-toggle>
      </div>
    </app-menu-item>
    }
    <!-- @for (task of timingTasks; track trackByFn($index, task)) {
    } -->
  </app-menu-list>
  }

  <div class="bottom-box">
    @if (device) {
    <app-menu-list>
      <app-menu-item icon="fa-light fa-plus" (click)="addTimingTask()">
        新建任务
      </app-menu-item>
    </app-menu-list>
    }
  </div>
</ion-content>
