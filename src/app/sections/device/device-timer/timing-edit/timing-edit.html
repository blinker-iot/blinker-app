<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text=""></ion-back-button>
    </ion-buttons>
    <ion-title>
      @if (mode=='new') { {{'TIMING.NEW_TIMING_TASK' | translate}} } @if
      (mode=='edit') { {{'TIMING.EDIT_TIMING_TASK' | translate}} }
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  @if (device) {
  <app-menu-list>
    <app-menu-item showArrow="true" (click)="openTimeModal()">
      <div>任务时间</div>
      <div class="right-box">{{timeInfo}}</div>
    </app-menu-item>
    <app-menu-item showArrow="true" (click)="openRepeatModal()">
      <div>重复设置</div>
      <div class="right-box">{{timingData.day | days2text}}</div>
    </app-menu-item>
    <app-menu-item showArrow="true" (click)="openActionModal()">
      <div>执行动作</div>
      <div class="right-box">
        {{ this.timingData.act[0] | actcmd2text:device.id}}
      </div>
    </app-menu-item>
  </app-menu-list>
  }
  <div class="bottom-box">
    @if (device) {
    <app-menu-list>
      <app-menu-item icon="fa-light fa-trash" (click)="save()">
        保存任务
      </app-menu-item>
      <app-menu-item icon="fa-light fa-floppy-disk" (click)="delete()">
        删除任务
      </app-menu-item>
    </app-menu-list>
    }
  </div>
</ion-content>
