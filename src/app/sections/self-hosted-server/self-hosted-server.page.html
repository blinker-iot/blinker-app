<ion-header class="server-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home/profile" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>自建服务器</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <main>
    <form class="server-form" (ngSubmit)="save()" novalidate aria-labelledby="server-form-heading">
      <h1 id="server-form-heading" class="section-heading">独立配置</h1>
      <div class="field" [class.field-invalid]="addressError">
        <label class="field-label" for="self-hosted-server-address">
          <span>服务器地址</span>
          <small>必填</small>
        </label>
        <span class="input-shell">
          <i class="fa-light fa-globe" aria-hidden="true"></i>
          <input
            id="self-hosted-server-address"
            name="serverAddress"
            type="url"
            inputmode="url"
            autocomplete="url"
            required
            placeholder="https://server.example.com"
            [(ngModel)]="serverAddress"
            (ngModelChange)="clearValidation('address')"
            [attr.aria-invalid]="addressError ? 'true' : 'false'"
            [attr.aria-describedby]="addressError ? 'address-help address-error' : 'address-help'"
          />
        </span>
        <small id="address-help" class="field-help">
          支持 HTTP、HTTPS、WS 和 WSS，请填写完整协议。
        </small>
        @if (addressError) {
        <small id="address-error" class="field-error" role="alert">
          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
          {{ addressError }}
        </small>
        }
      </div>

      <div class="field" [class.field-invalid]="keyError">
        <label class="field-label" for="self-hosted-server-key">
          <span>服务器密钥</span>
          <small>必填</small>
        </label>
        <span class="input-shell">
          <i class="fa-light fa-key" aria-hidden="true"></i>
          <input
            id="self-hosted-server-key"
            name="serverKey"
            [type]="showKey ? 'text' : 'password'"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            required
            placeholder="请输入服务器密钥"
            [(ngModel)]="serverKey"
            (ngModelChange)="clearValidation('key')"
            [attr.aria-invalid]="keyError ? 'true' : 'false'"
            [attr.aria-describedby]="keyError ? 'key-help key-error' : 'key-help'"
          />
          <button
            type="button"
            class="key-toggle"
            (click)="toggleKeyVisibility()"
            [attr.aria-label]="showKey ? '隐藏服务器密钥' : '显示服务器密钥'"
            [attr.aria-pressed]="showKey"
          >
            <i
              class="fa-light"
              [class.fa-eye]="!showKey"
              [class.fa-eye-slash]="showKey"
              aria-hidden="true"
            ></i>
          </button>
        </span>
        <small id="key-help" class="field-help">
          密钥仅保存在当前设备，请勿分享给他人。
        </small>
        @if (keyError) {
        <small id="key-error" class="field-error" role="alert">
          <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
          {{ keyError }}
        </small>
        }
      </div>

      @if (operationError) {
      <p class="field-error operation-error" role="alert">{{ operationError }}</p>
      }

      @if (saved) {
      <div class="save-success" role="status">
        <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
        配置已保存在本机
      </div>
      }

      <button type="submit" class="save-button">
        <i class="fa-light fa-floppy-disk" aria-hidden="true"></i>
        保存配置
      </button>

      @if (hasSavedConfig) {
      <button type="button" class="clear-button" (click)="confirmClear()">
        清除配置
      </button>
      }
    </form>

    <aside class="privacy-tip">
      <i class="fa-light fa-shield-check" aria-hidden="true"></i>
      <div>
        <strong>仅保存本机配置</strong>
        <p>这里的设置不会修改应用内置的 API 地址或现有账户连接。</p>
      </div>
    </aside>
  </main>
</ion-content>
