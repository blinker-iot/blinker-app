<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="backHref" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ titleKey | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <main>
    <section class="methods-section" aria-labelledby="methods-heading">
      <h2 id="methods-heading" class="section-label">
        {{ sectionTitleKey | translate }}
      </h2>

      <app-menu-list [items]="methodItems" [detailed]="true"
        (itemSelected)="selectMethod($event)"></app-menu-list>

      <h2 class="section-label" style="margin-top: 20px;">
        {{ 'DEVICE_GUIDE.OTHER' | translate }}
      </h2>
      <app-menu-list
        [items]="migrationItems"
        [detailed]="true"
        (itemSelected)="selectMethod($event)"
      ></app-menu-list>
    </section>

  </main>
</ion-content>
