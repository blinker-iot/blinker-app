<ion-header class="migration-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/guide" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'DEVICE_GUIDE.OLD_DEVICE_TITLE' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <main>
    <app-hero-card
      iconClass="fa-light fa-cloud-arrow-up"
      [eyebrow]="'DEVICE_GUIDE.OLD_DEVICE_EYEBROW' | translate"
      [heading]="'DEVICE_GUIDE.OLD_DEVICE_HEADING' | translate"
      [description]="'DEVICE_GUIDE.OLD_DEVICE_DESCRIPTION' | translate"
    />

    <form class="migration-form" (ngSubmit)="migrateData()" novalidate>
      <label class="form-label" for="old-device-phone">
        {{ 'DEVICE_GUIDE.OLD_DEVICE_PHONE' | translate }}
      </label>
      <div class="input-shell">
        <i class="fa-light fa-mobile-screen" aria-hidden="true"></i>
        <input
          id="old-device-phone"
          name="phoneNumber"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          maxlength="32"
          [placeholder]="'DEVICE_GUIDE.OLD_DEVICE_PHONE_PLACEHOLDER' | translate"
          [(ngModel)]="phoneNumber"
          (ngModelChange)="onFormChange()"
          [disabled]="isMigrating"
        />
      </div>

      <label class="form-label key-label" for="old-device-key">
        {{ 'DEVICE_GUIDE.OLD_DEVICE_KEY' | translate }}
      </label>
      <div class="input-shell">
        <i class="fa-light fa-key" aria-hidden="true"></i>
        <input
          id="old-device-key"
          name="deviceKey"
          [type]="keyVisible ? 'text' : 'password'"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="128"
          [placeholder]="'DEVICE_GUIDE.OLD_DEVICE_KEY_PLACEHOLDER' | translate"
          [(ngModel)]="deviceKey"
          (ngModelChange)="onFormChange()"
          [disabled]="isMigrating"
        />
        <button
          type="button"
          class="key-visibility"
          (click)="toggleKeyVisibility()"
          [disabled]="isMigrating"
        >
          <i
            class="fa-light"
            [class.fa-eye]="!keyVisible"
            [class.fa-eye-slash]="keyVisible"
            aria-hidden="true"
          ></i>
        </button>
      </div>

      @if (errorMessage) {
      <div class="form-error" role="alert">
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span>{{ errorMessage }}</span>
      </div>
      }

      <button class="primary-action" type="submit" [disabled]="isMigrating">
        @if (isMigrating) {
        <ion-spinner name="crescent" aria-hidden="true"></ion-spinner>
        <span>{{ 'DEVICE_GUIDE.OLD_DEVICE_SUBMITTING' | translate }}</span>
        } @else {
        <i class="fa-light fa-arrow-right-arrow-left" aria-hidden="true"></i>
        <span>{{ 'DEVICE_GUIDE.OLD_DEVICE_SUBMIT' | translate }}</span>
        }
      </button>
    </form>

    <aside class="security-card">
      <i class="fa-light fa-shield-check" aria-hidden="true"></i>
      <div>
        <strong>{{ 'DEVICE_GUIDE.OLD_DEVICE_SECURITY_TITLE' | translate }}</strong>
        <p>{{ 'DEVICE_GUIDE.OLD_DEVICE_SECURITY_DESCRIPTION' | translate }}</p>
      </div>
    </aside>
  </main>
</ion-content>
