<ion-header whitebg class="profile-editor-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>编辑资料</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <div slot="fixed" class="top-scroll-mask" aria-hidden="true"></div>

  <div class="editor-content">
    <input
      #avatarInput
      class="avatar-file-input"
      type="file"
      accept="image/*"
      (change)="onAvatarSelected($event)"
    />
    <button type="button" class="avatar-editor" (click)="avatarInput.click()" aria-label="更换头像">
      <div class="avatar-preview">
        @if (avatar) {
        <img [src]="avatar" alt="用户头像" />
        } @else {
        <span>{{ draftName.slice(0, 1) || 'A' }}</span>
        }
      </div>
      <span class="camera-button"><i class="fa-light fa-camera"></i></span>
    </button>
    <section class="form-card profile-card">
      <label class="form-row">
        <span>用户名</span>
        <input [(ngModel)]="draftName" maxlength="32" aria-label="用户名" />
        <i class="fa-light fa-chevron-right"></i>
      </label>
      <div class="form-row readonly-row">
        <span>手机号</span>
        <strong>{{ draftPhone }}</strong>
      </div>
      <button type="button" class="form-row" (click)="selectRegion()">
        <span>所在地区</span>
        <strong>{{ draftRegion }}</strong>
        <i class="fa-light fa-chevron-right"></i>
      </button>
    </section>

    <div class="section-label">账户安全</div>
    <section class="form-card security-card">
      <button type="button" class="form-row" (click)="showChangePassword()">
        <span>登录密码</span>
        <strong class="link-value">修改</strong>
        <i class="fa-light fa-chevron-right"></i>
      </button>
      <button type="button" class="form-row">
        <span>账号与安全</span>
        <strong>已保护</strong>
        <i class="fa-light fa-chevron-right"></i>
      </button>
    </section>

    <button type="button" class="primary-save" [disabled]="saving" (click)="saveProfile()">
      @if (saving) {
      <i class="fa-light fa-spinner-third fa-spin"></i>
      } @else {
      保存
      }
    </button>

  </div>
</ion-content>
