<ion-header whitebg class="message-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>消息中心</ion-title>
    <ion-buttons slot="end">
      <ion-button aria-label="全部标为已读" (click)="markAllRead()">
        <i class="fa-light fa-check-double"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <div class="message-content">
    <div class="message-filters" role="tablist" aria-label="消息分类">
      @for (filter of filters; track filter.value) {
      <button
        type="button"
        role="tab"
        [attr.aria-selected]="activeFilter === filter.value"
        [class.active]="activeFilter === filter.value"
        (click)="selectFilter(filter.value)"
      >
        {{ filter.label }}
      </button>
      }
    </div>

    @if (visibleMessages.length > 0) {
    <section class="message-list">
      @for (message of visibleMessages; track message.id) {
      <button type="button" class="message-item" (click)="openMessage(message)">
        <span class="message-icon" [attr.data-category]="message.category">
          <i [class]="message.icon"></i>
        </span>
        <span class="message-copy">
          <span class="message-title">{{ message.title }}</span>
          <span class="message-preview">{{ message.content }}</span>
        </span>
        <span class="message-meta">
          <time>{{ message.time }}</time>
          @if (message.unread) {
          <span class="unread-dot"></span>
          }
          <span class="delete-action" role="button" tabindex="0" (click)="deleteMessage(message, $event)">
            <i class="fa-light fa-trash-can"></i>
          </span>
        </span>
      </button>
      }
    </section>

    <div class="inbox-hint">
      <div class="bubble-illustration">
        <span></span><span></span><span></span>
      </div>
      <strong>以上是全部消息</strong>
      <p>轻松生活，从此刻开始</p>
    </div>
    } @else {
    <div class="empty-message">
      <div class="bubble-illustration">
        <span></span><span></span><span></span>
      </div>
      <strong>暂无此类消息</strong>
      <p>新的动态会第一时间出现在这里</p>
    </div>
    }
  </div>
</ion-content>
