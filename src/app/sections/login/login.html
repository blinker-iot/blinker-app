<ion-header class="ion-no-border main-tab-header login-header">
  <ion-toolbar>
    <ion-buttons slot="end" class="login-actions">
      <ion-button
        fill="clear"
        class="header-action settings-button"
        aria-label="打开设置"
        (click)="openSettings()"
      >
        <i class="fa-light fa-gear" aria-hidden="true"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <div class="login-container">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="logo-box">
      <img class="logo" src="{{LOGO}}" />
      <h2 class="welcome-title">{{'ACCOUNT.LOGIN' | translate}}</h2>
    </div>

    <form class="form-box" (ngSubmit)="login()" #formBox="ngForm">
      <div class="input-box">
        <div class="item-img">
          <i class="fal fa-envelope"></i>
        </div>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="{{'ACCOUNT.EMAIL' | translate}}"
          (focus)="onFocus()"
          (blur)="onBlur()"
        />
      </div>
      <div class="input-box">
        <div class="item-img">
          <i class="fal fa-shield-check"></i>
        </div>
        <input
          type="text"
          [(ngModel)]="code"
          name="code"
          placeholder="{{'ACCOUNT.VERIFY_CODE' | translate}}"
          maxlength="6"
          (focus)="onFocus()"
          (blur)="onBlur()"
        />
        <button
          type="button"
          class="send-code-btn"
          [disabled]="countdown > 0"
          (click)="sendCode($event)"
        >
          @if (countdown === 0) {
          <span>{{'ACCOUNT.SEND_CODE' | translate}}</span>
          } @if (countdown > 0) {
          <span>{{countdown}}s</span>
          }
        </button>
      </div>
      <div class="login-tip">{{'ACCOUNT.LOGIN_TIP' | translate}}</div>
      <div class="login-consent">
        {{'ACCOUNT.LOGIN_AGREEMENT_PREFIX' | translate}}
        <span class="link-text" (click)="openUrl(USER_AGREEMENT,'用户协议')">
          {{'ACCOUNT.USER_AGREEMENT' | translate}}
        </span>
        {{'ACCOUNT.AND' | translate}}
        <span class="link-text" (click)="openUrl(PRIVACY_POLICY,'隐私政策')">
          {{'ACCOUNT.PRIVACY_POLICY' | translate}}
        </span>
      </div>
      <button type="submit" class="login-btn">
        {{'ACCOUNT.LOGIN' | translate}}
      </button>
    </form>

  </div>
</ion-content>
