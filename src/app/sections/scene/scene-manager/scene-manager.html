<ion-header><ion-toolbar>
  <ion-buttons slot="start"><ion-back-button text="" defaultHref="/automation-manager" /></ion-buttons>
  <ion-title>原场景配置存档</ion-title>
</ion-toolbar></ion-header>
<ion-content><main>
  <p>这些是旧版保存的场景配置，仅供查阅，不会执行或自动转换为云端自动化。</p>
  <ion-button routerLink="/automation-manager">进入自动化</ion-button>
  @for (name of sceneNames; track name) {
    <section class="manager-card"><h2>{{ name }}</h2><p>{{ actionCount(name) }} 个原配置动作 · 未接入当前执行器</p></section>
  } @empty { <p>暂无原场景配置。</p> }
</main></ion-content>
