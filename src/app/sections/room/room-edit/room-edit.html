<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button [disabled]="saving" (click)="cancel()">取消</ion-button>
    </ion-buttons>
    <ion-title>区域设置</ion-title>
    <ion-buttons slot="end">
      <ion-button [disabled]="!loaded || saving" (click)="save()">{{ saving ? '保存中…' : '保存' }}</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <main>
    @if (error) {
    <div class="error-message" role="alert">
      <span>{{ error }}</span>
      <button type="button" (click)="load()">重新加载</button>
    </div>
    }

    @if (loaded) {
    <button type="button" class="name-row" (click)="changeRoomName()" [disabled]="saving">
      <span>区域名称</span>
      <strong>{{ roomName }}</strong>
      <i class="fa-light fa-pen" aria-hidden="true"></i>
    </button>

    <h2>设备 <small>{{ currentRoomData.length }} 台已选择</small></h2>

    <section class="device-list" aria-label="区域设备">
      @for (deviceId of deviceDataList; track deviceId) {
      <button
        type="button"
        class="device-row"
        [disabled]="saving"
        [attr.aria-pressed]="isSelected(deviceId)"
        (click)="toggleDevice(deviceId)"
      >
        <b-device-img [deviceId]="deviceId"></b-device-img>
        <span>{{ deviceDataDict[deviceId]?.config?.customName || '设备' }}</span>
        <i [class]="isSelected(deviceId) ? 'fa-solid fa-circle-check' : 'fa-light fa-circle'" aria-hidden="true"></i>
      </button>
      } @empty {
      <p class="empty-state">暂无可添加的设备</p>
      }
    </section>
    } @else if (!error) {
    <p class="empty-state">正在加载…</p>
    }
  </main>
</ion-content>
