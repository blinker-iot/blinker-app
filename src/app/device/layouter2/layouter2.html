<ng-template #headerActions>
  @if (canEditLayout) {
  @if (mode != 'edit') {
  <ion-button class="layouter-action" aria-label="编辑布局" (click)="unlock()">
    <i class="fa-light fa-pen-to-square"></i>
  </ion-button>
  } @else {
  <ion-button class="layouter-action" aria-label="清空组件" [disabled]="savingLayout" (click)="cleanWidgets()">
    <i class="fa-light fa-trash-can"></i>
  </ion-button>
  <ion-button class="layouter-action" aria-label="保存布局" [disabled]="savingLayout" (click)="lock()">
    <i class="fa-light fa-lock"></i>
  </ion-button>
  }
  }
</ng-template>
<div device-box #gridsterBox [attr.data-interface-style]="config.interfaceStyle || null" [class.is-editing]="mode == 'edit'">
  <gridster [options]="options">
    @for (widget of dashboard; track widget) {
    <gridster-item [item]="widget">
      <widget-dynamic
        [widget]="widget"
        [lstyle]="widget['lstyle']"
        [device]="device"
        [resizeEvent]="resizeEvent"
        [editMode]="mode == 'edit'"
      ></widget-dynamic>
    </gridster-item>
    }
  </gridster>
</div>
@if (mode == 'edit') {
<div class="animated slideInUp faster layouter-bar">
  <widget-listbar></widget-listbar>
</div>
}
