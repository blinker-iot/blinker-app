<div class="scrollHeight">
  <div demo-box class="scale">
    @for (widget of buttonList; track widget; let i = $index) {
    <div
      class="widgetitem"
      #widgetItem
      (click)="changeAction(i)"
      [ngClass]="{'selected':isSelected(widget)}"
    >
      <widget-dynamic
        [widget]="widget"
        [device]="device"
        [isDemo]="true"
      ></widget-dynamic>
    </div>
    }
  </div>
</div>
