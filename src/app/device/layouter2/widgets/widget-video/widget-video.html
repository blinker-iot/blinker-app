@if (streamType === 'mjpg') {
<div class="media-box">
  @if (renderImage && mediaUrl) {
  <img
    class="media-content"
    [src]="mediaUrl"
    alt=""
    (load)="onImageLoad()"
    (error)="onImageError()"
  />
  }
  @if (showNoData) {
  <div class="video-empty" role="img" aria-label="暂无视频数据">
    <i class="fa-light fa-empty-set" aria-hidden="true"></i>
    <small class="video-empty-text">暂无视频数据</small>
  </div>
  }
</div>
} @if (streamType === 'hls') {
<div class="vidbox" (click)="switch()">
  <video class="full" #video></video>
  <div
    class="full"
    [ngClass]="{ showVideo: showVideo && !showNoData }"
    [attr.role]="showNoData ? 'img' : null"
    [attr.aria-label]="showNoData ? '暂无视频数据' : null"
  >
    <div class="vbat">
      @if (showNoData) {
      <i class="fa-light fa-empty-set video-empty-icon" aria-hidden="true"></i>
      <small class="video-empty-text">暂无视频数据</small>
      } @else {
      <i class="fa-light fa-play-circle" aria-hidden="true"></i>
      }
    </div>
  </div>
  @if (showVideo && !showNoData) {
  <div class="lb">
    @if (playerState === 'pause' || playerState === 'load') {
    <i class="fas fa-play"></i>
    } @if (playerState === 'play') {
    <i class="fas fa-pause"></i>
    }
  </div>
  }
</div>
}
