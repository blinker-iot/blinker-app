<div widget [ngClass]="{'flex-row-box': lstyle==2 || lstyle==3}">
  @if (lstyle==3) {
  <div class="jj-box jj-box2">
    <button type="button" class="jj-btn" aria-label="减小数值" [disabled]="value <= min" (click)="jian()">
      <i class="fal fa-minus"></i>
    </button>
  </div>
  }
  <div
    class="rangebox"
    #rangbox
    [ngClass]="{'full': lstyle==2||lstyle==3||lstyle==4||lstyle==5}"
  >
    <div class="textbox">
      <span>{{t0}}</span>
      <span>{{value}}</span>
    </div>
    <b-range
      [min]="min"
      [max]="max"
      [(value)]="value"
      (valueChange)="sendData($event)"
      [barcolor]="'var(--blinker-surface-muted)'"
      [activecolor]="color || 'var(--ion-color-primary)'"
    >
      <div class="textbox top" aria-hidden="true" [ngStyle]="{'width': textBoxWidth}">
        <span>{{t0}}</span>
        <span>{{value}}</span>
      </div>
    </b-range>
  </div>
  <!-- 加减按键 -->
  @if (lstyle==2) {
  <div class="jj-box">
    <button type="button" class="jj-btn" aria-label="增大数值" [disabled]="value >= max" (click)="jia()">
      <i class="fal fa-plus"></i>
    </button>
    <button type="button" class="jj-btn" aria-label="减小数值" [disabled]="value <= min" (click)="jian()">
      <i class="fal fa-minus"></i>
    </button>
  </div>
  } @if (lstyle==3) {
  <div class="jj-box jj-box2">
    <button type="button" class="jj-btn" aria-label="增大数值" [disabled]="value >= max" (click)="jia()">
      <i class="fal fa-plus"></i>
    </button>
  </div>
  }
</div>
