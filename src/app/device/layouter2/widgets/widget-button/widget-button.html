<div
  widget
  #button
  (tap)="tap($event)"
  (press)="press($event)"
  (pressup)="pressup($event)"
>
  @if (lstyle==0||lstyle==2) {
  <div
    class="btnbox action"
    [ngStyle]="{'background': state=='on'?color:''}"
    [ngClass]="{'on':state=='on','off':state!='on'}"
  >
    <i
      class="{{ico}}"
      [ngStyle]="{'color': color}"
      [ngClass]="{'bigger': lstyle==2}"
    ></i>
    <div class="content" overflow>{{t0}}</div>
  </div>
  } @if (lstyle==1||lstyle==3) {
  <div class="btnbox">
    <div
      class="toggle-box"
      [ngStyle]="{'background-color': state=='on'?color:''}"
    >
      <div
        class="toggle-inner"
        [ngClass]="{'on':state=='on','off':state!='on'}"
      ></div>
    </div>
    @if (lstyle!=3) {
    <div class="content" overflow>{{t0}}</div>
    }
  </div>
  } @if (lstyle==4) {
  <div
    class="btnbox action"
    [ngStyle]="{'background': state=='on'?color:''}"
    [ngClass]="{'on':state=='on','off':state!='on'}"
  >
    <i
      class="{{ico}}"
      style="font-size: 1.2rem"
      [ngStyle]="{'color': color}"
    ></i>
  </div>
  }
</div>
