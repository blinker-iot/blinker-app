<div widget class="tabsbox">
  @if (ico) {
  <button type="button" class="tab" [attr.aria-pressed]="val" (click)="selectTab(0)">
    <i class="{{ ico }}" [ngStyle]="{ color: val ? color : '' }"></i>
    <div class="content" overflow>{{ t0 }}</div>
  </button>
  } @if (ico1) {
  <button type="button" class="tab" [attr.aria-pressed]="val1" (click)="selectTab(1)">
    <i class="{{ ico1 }}" [ngStyle]="{ color: val1 ? color : '' }"></i>
    <div class="content" overflow>{{ t1 }}</div>
  </button>
  } @if (ico2) {
  <button type="button" class="tab" [attr.aria-pressed]="val2" (click)="selectTab(2)">
    <i class="{{ ico2 }}" [ngStyle]="{ color: val2 ? color : '' }"></i>
    <div class="content" overflow>{{ t2 }}</div>
  </button>
  } @if (ico3) {
  <button type="button" class="tab" [attr.aria-pressed]="val3" (click)="selectTab(3)">
    <i class="{{ ico3 }}" [ngStyle]="{ color: val3 ? color : '' }"></i>
    <div class="content" overflow>{{ t3 }}</div>
  </button>
  } @if (ico4) {
  <button type="button" class="tab" [attr.aria-pressed]="val4" (click)="selectTab(4)">
    <i class="{{ ico4 }}" [ngStyle]="{ color: val4 ? color : '' }"></i>
    <div class="content" overflow>{{ t4 }}</div>
  </button>
  }
</div>
