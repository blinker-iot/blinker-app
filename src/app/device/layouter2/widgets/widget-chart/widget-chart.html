<div widget>
  <!-- <div widget-name>{{widget.tex}}</div> -->
  <div widget-content>
    <div
      class="chartbox"
      #chartbox
      [ngStyle]="{'visibility': !isHidden?'visible':'hidden'}"
    >
      @if (showChart) {
      <line-chart-area
        [data]="data"
        [color]="selectedItem.color"
        [quickCode]="quickCode"
      ></line-chart-area>
      }
    </div>
    @if (isHidden) {
    <div class="nodata">暂无数据</div>
    }
    <div class="btnbox">
      @for (item of widget.items; track item; let i = $index) { @if (item.key) {
      <div
        class="item"
        (click)="selectItem(item)"
        [ngStyle]="{'background-color': item.color}"
        [ngClass]="{'selected': selectedItem==item,'unselected':selectedItem!=item}"
      >
        {{item.name}}
      </div>
      } }
    </div>
    <select [(ngModel)]="quickCode" (ngModelChange)="changeQuickCode()">
      <!-- <option value="rt">实时</option> -->
      <option value="1h">最近1小时</option>
      <option value="1d">最近1天</option>
      <option value="1w">最近1周</option>
    </select>
  </div>
</div>
