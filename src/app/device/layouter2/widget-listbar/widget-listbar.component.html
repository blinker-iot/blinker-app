<div class="bar" appHorizontalDragScroll>
  <div class="btns">
    @for (button of widgetList; track button; let i = $index) {
    <div
      class="btn"
      [ngClass]="{ begin: i == 0, end: i == widgetList.length - 1 }"
    >
      <div class="btn-inner" (click)="addWidget(button.type)">
        <div class="block">
          <i class="{{ button.icon }}"></i>
        </div>
        <div class="name">{{ button.name }}</div>
      </div>
    </div>
    }
  </div>
</div>
