@if (showTitle) {
  <div class="hd">
    @if (options.icon) { <span class="hd-ico"><app-ui-icon [name]="options.icon" /></span> }

    <span class="hd-t">{{ title }}</span>
  </div>
}

<div class="bn" [class]="size" [class.warn]="alert">
  @let display = displayReading;

  <div class="bn-num num" [attr.title]="'原始值：' + fullValue" [attr.aria-label]="title + '，原始值：' + fullValue">
    <span class="bn-value" [valueTransition]="display.text" [style.--reading-length]="display.text.length || 1">{{ display.text }}</span>
    <span class="bn-u" [class.base]="options.unitPosition === 'base'">{{ display.unit }}</span>
  </div>

  @if (rows > 1 || size === 'md') {
    <div class="bn-sub">

      @if (options.showDelta && delta) {
        <span class="delta"><span class="delta-arrow">{{ delta.charAt(0) }}</span><span [valueTransition]="delta">{{ delta.slice(1) }}</span></span>
      }

      <span [valueTransition]="withExtras(note)">{{ withExtras(note) }}</span>
    </div>
  }

</div>
