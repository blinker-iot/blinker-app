@if (showTitle && rows > 1) {
  <div class="hd">
    @if (options.icon) { <span class="hd-ico"><app-ui-icon [name]="options.icon" /></span> }
    <span class="hd-t">{{ title }}</span>
    @if (sent(); as label) { <span class="hd-v">已发送 {{ label }}</span> }
  </div>
}

<div class="keys" role="group" [attr.aria-label]="title" [style.--cols]="columns">
  @for (key of keys; track key.label) {
    <button type="button" class="key" [class.toned]="key.tone" [class.sent]="sent() === key.label"
      [style.--c]="key.tone ? 'var(--ui-' + key.tone + ')' : null" [disabled]="card.disabled" (click)="press(key.label)">
      @if (key.icon) { <app-ui-icon [name]="key.icon" /> }
      <span>{{ key.label }}</span>
    </button>
  }
</div>
