@if (shape === 'card') {
  <button type="button" class="op" [class.run]="status() === 'run'" [class.holding]="holding()"
    [attr.aria-label]="title + '，' + caption" [disabled]="card.disabled" (click)="tap()"
    (pointerdown)="holdStart($event)" (pointerup)="holdEnd()" (pointerleave)="holdEnd()" (pointercancel)="holdEnd()"
    (contextmenu)="$event.preventDefault()">
    <span class="op-chip"><app-ui-icon [name]="icon" /></span>
    @if (options.showCount && count()) { <span class="op-count num">×{{ count() }}</span> }
    <span class="op-copy">
      @if (showTitle) { <span class="op-t">{{ title }}</span> }
      <span class="op-s">{{ caption }}</span>
    </span>
    <span class="op-go"><app-ui-icon [name]="status() === 'done' ? 'check' : 'arrow'" /></span>
    <i class="op-hold"></i>
  </button>
} @else {
  <button type="button" class="act" [class.run]="status() === 'run'" [class.holding]="holding()"
    [attr.aria-label]="title" [disabled]="card.disabled" (click)="tap()"
    (pointerdown)="holdStart($event)" (pointerup)="holdEnd()" (pointerleave)="holdEnd()" (pointercancel)="holdEnd()"
    (contextmenu)="$event.preventDefault()">
    <app-ui-icon [name]="icon" />
  </button>

  <span class="act-t">{{ title }}</span>
  @if (showCaption) { <span class="act-s">{{ caption }}</span> }
}
