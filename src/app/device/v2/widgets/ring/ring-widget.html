<div class="hd">
  @if (showTitle) {
    @if (options.icon) { <span class="hd-ico"><app-ui-icon [name]="options.icon" /></span> }
    <span class="hd-t">{{ title }}</span>
  }
  @if (shape !== 'segments') {
    <svg class="rg-ind" [class.half]="shape === 'half'" [attr.viewBox]="viewBox" aria-hidden="true">
      <path class="arc-track" [attr.d]="track" stroke-width="4" />
      @if (progress) { <path class="arc-prog" [class.warn]="alert" [attr.d]="progress" stroke-width="4" /> }
    </svg>
  }
</div>

<div class="bn md" [class.warn]="alert" role="meter" [attr.aria-label]="title" [attr.aria-valuemin]="min"
  [attr.aria-valuemax]="max" [attr.aria-valuenow]="number ?? null">
  <div class="bn-num num"><span [valueTransition]="displayReading.text">{{ displayReading.text }}</span><span class="bn-u">{{ displayReading.unit }}</span></div>
  @if (shape === 'segments') {
    <div class="rg-seg">
      @for (lit of segments; track $index) { <i [class.on]="lit"></i> }
    </div>
  }
  @if (withExtras(note); as line) { <div class="bn-sub"><span [valueTransition]="line">{{ line }}</span></div> }
</div>
