@if (loaded && device) {
  <app-device-v2-page [device]="device"></app-device-v2-page>
} @else if (loaded) {
  <ion-content>
    <div class="device-not-found">
      <i class="fa-light fa-circle-exclamation"></i>
      <h1>未找到设备</h1>
      <p>设备可能已被删除，或登录数据尚未加载完成。</p>
      <a routerLink="/home/device">返回设备列表</a>
    </div>
  </ion-content>
}
