@if (iframeSrc) {
<iframe
  class="device-template-frame"
  [src]="iframeSrc"
  title="设备自定义界面"
  (load)="onFrameLoad($event)"
></iframe>
} @if (loading && !isFailed) {
<div class="state-overlay loading-overlay" role="status" aria-live="polite">
  <span class="loading-spinner" aria-hidden="true"></span>
  <strong>正在连接设备界面</strong>
  <p>准备安全通信通道…</p>
</div>
} @if (isFailed) {
<div class="state-overlay error-overlay" role="alert">
  <span class="error-icon" aria-hidden="true">!</span>
  <strong>设备界面加载失败</strong>
  <p>{{ errorMessage }}</p>
  <button type="button" (click)="retry()">重新加载</button>
</div>
}
