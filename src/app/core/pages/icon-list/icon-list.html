<ion-header class="icon-header">
  <ion-toolbar>
    <ion-title>选择场景图标</ion-title>
    <ion-buttons slot="end">
      <ion-button
        class="close-button"
        (click)="close()"
        aria-label="关闭图标选择"
      >
        <i class="fa-light fa-times"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen="true">
  <main class="icon-content">
    <section class="style-panel">
      <div class="style-copy">
        <strong>图标风格</strong>
        <small>选择适合当前场景的显示样式</small>
      </div>
      <div class="style-tabs" role="group" aria-label="图标风格">
        <button
          type="button"
          (click)="selectStyle('fad')"
          [class.selected]="style === 'fad'"
        >
          双色
        </button>
        <button
          type="button"
          (click)="selectStyle('fas')"
          [class.selected]="style === 'fas'"
        >
          实体
        </button>
        <button
          type="button"
          (click)="selectStyle('far')"
          [class.selected]="style === 'far'"
        >
          常规
        </button>
        <button
          type="button"
          (click)="selectStyle('fal')"
          [class.selected]="style === 'fal'"
        >
          纤细
        </button>
      </div>
    </section>

    @for (iconClass of iconList; track iconClass) {
    <section class="icon-category">
      <div class="category-title">{{ iconClass.title }}</div>
      <div class="icon-grid">
        @for (icon of iconClass.icon; track icon) {
        <button
          type="button"
          class="icon-item"
          (click)="select(icon.replace('fad', style))"
          aria-label="选择此图标"
        >
          <i class="{{icon.replace('fad',style)}}"></i>
        </button>
        }
      </div>
    </section>
    }
  </main>
</ion-content>
