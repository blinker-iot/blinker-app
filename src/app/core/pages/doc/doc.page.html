<ion-header class="doc-page-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button
        class="close-button header-action"
        fill="clear"
        aria-label="关闭文档"

        (click)="close()"
      >
        <i class="fa-light fa-xmark" aria-hidden="true"></i>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ docTitle }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content
  class="doc-page-content"

  [attr.aria-busy]="loadState() === 'loading'"
>
  <div class="doc-content">
    @switch (loadState()) {
      @case ('loading') {
        <div class="doc-state" role="status" aria-live="polite">
          <ion-spinner name="crescent"></ion-spinner>
          <p>正在加载文档…</p>
        </div>
      }

      @case ('error') {
        <div class="doc-state" role="alert">
          <h2>文档加载失败</h2>
          <p>请检查网络连接后重新加载。</p>
          <ion-button fill="outline" size="small" (click)="loadDocument()">
            重新加载
          </ion-button>
        </div>
      }

      @case ('empty') {
        <div class="doc-state" role="status">
          <h2>暂无内容</h2>
          <p>该文档当前没有可显示的内容。</p>
          <ion-button fill="outline" size="small" (click)="loadDocument()">
            重新加载
          </ion-button>
        </div>
      }

      @case ('ready') {
        <article class="markdown-document">
          <markdown [data]="docContent()"></markdown>
        </article>
      }
    }

  </div>

</ion-content>
