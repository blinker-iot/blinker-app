<div class="dismiss" (click)="clickCancel()"></div>
<div class="select-modal">
  <div class="item-list" style="margin-bottom: 65px">
    @for (day of dayList; track day; let i = $index) {
    <div class="item" (click)="choseDay(i)">
      <div translate>{{ day }}</div>
      @if (data[i]!='1') {
      <i class="fal fa-circle"></i>
      } @else {
      <i class="fas fa-check-circle"></i>
      }
    </div>
    }
  </div>
  <div class="modal-footer">
    <div class="modal-btn" (click)="clickCancel()">
      {{ "OTHER.CANCEL" | translate }}
    </div>
    <div class="line"></div>
    <div class="modal-btn" (click)="clickConfirm()">
      {{ "OTHER.CONFIRM" | translate }}
    </div>
  </div>
</div>
