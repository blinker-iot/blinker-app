<div class="scene-btn-box" (click)="sendData()">
  <div class="icon">
    <i class="{{scene.ico}}"></i>
  </div>
  <div class="scene-name" overflow>{{sceneName}}</div>
  <div class="status">
    @if (state=='doing') {
    <img src="svg/tail-spin.svg" />
    } @if (state=='done') {
    <div class="circle animated fadeIn">
      <ion-icon name="checkmark"></ion-icon>
    </div>
    }
  </div>
</div>
