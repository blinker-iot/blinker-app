@if (variant === 'light') {
<img loading="lazy" decoding="async" [src]="lightUrl" [alt]="alt" (error)="useFallback($event, 'light')" />
} @else if (variant === 'dark') {
<img loading="lazy" decoding="async" [src]="darkUrl" [alt]="alt" (error)="useFallback($event, 'dark')" />
} @else {
<img
  class="theme-image light-image"
  loading="lazy"
  decoding="async"
  [src]="lightUrl"
  [alt]="alt"
  (error)="useFallback($event, 'light')"
/>
<img
  class="theme-image dark-image"
  loading="lazy"
  decoding="async"
  [src]="darkUrl"
  [alt]="alt"
  (error)="useFallback($event, 'dark')"
/>
}
