<div
  class="blinke-tip animate__animated animate__faster"
  [ngClass]="{ animate__fadeInUp: !hide, animate__fadeOutDown: hide }"
>
  <div text-box>
    @if (tip.type=='error') {
    <i class="fal fa-exclamation-circle error"></i>
    } @if (tip.type=='warn') {
    <i class="fal fa-exclamation-circle warn"></i>
    } @if (tip.type=='done') {
    <i class="fal fa-check-circle done"></i>
    }
    <div mess>{{ tip.message }}</div>
    @if (tip.url) {
    <div>
      <i class="fal fa-question-circle"></i>
    </div>
    }
  </div>
  <div close-btn (click)="close()">
    <i class="fal fa-times"></i>
  </div>
</div>
