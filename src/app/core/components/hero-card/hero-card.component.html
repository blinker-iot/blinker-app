<section class="hero-card">
  @if (hasSummary) {
    <span class="hero-icon" aria-hidden="true"><i [class]="iconClass"></i></span>
    <div class="hero-copy">
      <span class="eyebrow">{{ eyebrow }}</span>
      <h1>{{ heading }}</h1>
      <p>{{ description }}</p>
    </div>
  }
  <div class="hero-content"><ng-content></ng-content></div>
</section>
