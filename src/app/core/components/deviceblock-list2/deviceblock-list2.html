<div class="scroll">
  <div class="block-box">
    @for (deviceId of deviceDataList; track deviceId; let i = $index) {
    <div
      class="block"
      [ngClass]="{'selected':selectedDeviceIndex==i}"
      (click)="selectDevice(i,deviceDataDict[deviceId])"
    >
      <b-device-img [deviceId]="deviceId"></b-device-img>
      <div class="h-line"></div>
      <div class="block-text">
        <span> {{deviceDataDict[deviceId].config.customName}} </span>
      </div>
      @if (deviceDataDict[deviceId].config.mode=='ble') {
      <img class="mode" src="img/icon/ble.png" />
      }
    </div>
    }
  </div>
</div>
