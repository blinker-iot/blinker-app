@if (isDiy) {
<widget-buttonlist
  [device]="device"
  (update)="updateSelectedAction($event)"
></widget-buttonlist>
} @if (!isDiy) {
<div class="scrollHeight">
  <div class="cmd-box" demo-box>
    @for (item of cmdList; track item; let i = $index) {
    <div
      class="cmd-item"
      demo-item
      (click)="updateSelectedAction([item.cmd])"
      [ngClass]="{ selected: selectedItem == item.cmd }"
    >
      {{ item.cmd | actcmd2text : device.id }}
    </div>
    }
  </div>
</div>
}
