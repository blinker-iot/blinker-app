<title>Blinker 控件库</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@500..900&family=Geist+Mono:wght@300..600&family=Outfit:wght@200..600&display=swap">
<style>
/* Layout: 左侧为米家控制中心式 8 栏组件画廊，右侧为参数检查器；三套皮肤共用同一组 token 名 */
:root, html[data-skin="natural"] {
  color-scheme: light;
  --bg: #F2F3F5; --bg-pattern: none;
  --surface: #FFFFFF; --surface-2: #F4F5F7; --track: #ECEEF1;
  --ink: #17191C; --muted: #868B93; --faint: #BDC1C7; --line: #E8EAEE;
  --on-tone: #FFFFFF; --knob: #FFFFFF; --knob-shadow: 0 1px 3px rgba(23, 25, 28, .16);
  --card-border: transparent; --shadow: 0 1px 2px rgba(23, 25, 28, .03), 0 8px 24px rgba(23, 25, 28, .04);
  --focus: #3482FF;
  --t-blue: #3482FF; --t-orange: #FF9A1F; --t-green: #22B573; --t-purple: #7F63F4; --t-teal: #10B3BE; --t-red: #FF5146;
  --ok: #22B573; --warn: #FF5146; --off: #B4B8BF; --info: #3482FF;
  --radius: 22px; --radius-s: 14px; --row: 84px;
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Helvetica Neue", sans-serif;
  --font-num: "Outfit", "Helvetica Neue", Arial, sans-serif; --num-w: 300;
  --font-mono: "Geist Mono", ui-monospace, Menlo, monospace;
  --case: none; --track-l: 0; --h-prefix: "";
}
html[data-skin="dark"] {
  color-scheme: dark;
  --bg: #0C0D0F; --bg-pattern: none;
  --surface: #1B1C20; --surface-2: #26272C; --track: #2C2E34;
  --ink: #EEF0F3; --muted: #8C9099; --faint: #50545B; --line: #2B2D32;
  --on-tone: #FFFFFF; --knob: #F4F5F7; --knob-shadow: 0 1px 4px rgba(0, 0, 0, .5);
  --card-border: rgba(255, 255, 255, .035); --shadow: none;
  --focus: #4D93FF;
  --t-blue: #4D93FF; --t-orange: #FFA53D; --t-green: #35C987; --t-purple: #937BFF; --t-teal: #26C4CE; --t-red: #FF6459;
  --ok: #35C987; --warn: #FF6459; --off: #5E626A; --info: #4D93FF;
}
html[data-skin="electro"] {
  color-scheme: dark;
  --bg: #070809; --bg-pattern: radial-gradient(circle, rgba(255, 255, 255, .045) 1px, transparent 1.3px);
  --surface: #0F1113; --surface-2: #15181B; --track: #2A2D31;
  --ink: #E8E8E6; --muted: #8B8E91; --faint: #45484C; --line: #24272B;
  --on-tone: #070809; --knob: #E8E8E6; --knob-shadow: none;
  --card-border: #2A2D31; --shadow: none;
  --focus: #FF3B30;
  --t-blue: #FF3B30; --t-orange: #FF3B30; --t-green: #FF3B30; --t-purple: #FF3B30; --t-teal: #FF3B30; --t-red: #FF3B30;
  --ok: #E8E8E6; --warn: #FF3B30; --off: #45484C; --info: #E8E8E6;
  --radius: 14px; --radius-s: 8px;
  --font-ui: "Geist Mono", ui-monospace, "PingFang SC", Menlo, monospace;
  --font-num: "Doto", "Geist Mono", ui-monospace, monospace; --num-w: 800;
  --case: uppercase; --track-l: .06em; --h-prefix: "## ";
}
</style>
<script>
  try {
    const saved = localStorage.getItem('blinker-ui-skin');
    document.documentElement.dataset.skin = ['natural', 'electro', 'dark'].includes(saved)
      ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'natural');
  } catch (error) {
    document.documentElement.dataset.skin = 'natural';
  }
</script>
<style>
* { box-sizing: border-box; }

html, body { background: var(--bg); color: var(--ink); }

body {
  font-family: var(--font-ui);
  background-image: var(--bg-pattern);
  background-size: 16px 16px;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.page {
  max-width: 1380px;
  margin: 0 auto;
  padding-inline: clamp(16px, 3vw, 36px);
  padding-block: 28px 72px;
}

/* ---------- 顶部 ---------- */

.top {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 18px 28px;
  padding-block: 4px 26px;
}

.brand h1 {
  margin: 0;
  font-size: clamp(26px, 3.6vw, 36px);
  font-weight: 600;
  letter-spacing: -.01em;
  text-wrap: balance;
}

html[data-skin="electro"] .brand h1 {
  font-family: var(--font-num);
  font-weight: 800;
  font-size: clamp(32px, 5.4vw, 54px);
  letter-spacing: .05em;
  text-transform: uppercase;
}

.brand p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 60ch; }

.spec {
  margin-top: 10px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .06em;
  color: var(--muted);
}

.skins {
  display: inline-flex;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow);
}

.skins button {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13px;
  color: var(--muted);
  transition: background-color .2s, color .2s;
}

.skins button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }

.skins i { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .35); }

html[data-skin="electro"] .skins { border-radius: 4px; border-style: dotted; border-color: var(--faint); }
html[data-skin="electro"] .skins button { border-radius: 2px; text-transform: uppercase; letter-spacing: .06em; }
html[data-skin="electro"] .skins button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- 工作台 ---------- */

.bench {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 28px;
  align-items: start;
}

.sec + .sec { margin-top: 36px; }

.sec-h {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin: 0 0 14px;
  font-size: 15px;
  font-weight: 600;
  text-transform: var(--case);
  letter-spacing: var(--track-l);
}

.sec-h::before { content: var(--h-prefix); color: var(--muted); font-weight: 400; }

.sec-h small { font-family: var(--font-mono); font-size: 11px; font-weight: 400; color: var(--muted); }

.grid {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  grid-auto-rows: var(--row);
  grid-auto-flow: row dense;
  gap: 12px;
}

.slot {
  --s: 2; --r: 2;
  grid-column: span var(--s);
  grid-row: span var(--r);
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.cardwrap { flex: 1; min-height: 0; display: flex; }

.cap {
  display: flex;
  gap: 6px;
  height: 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cap b { color: var(--faint); font-weight: 500; }

.slot.sel .card { outline: 2px solid var(--focus); outline-offset: 3px; }

html[data-skin="electro"] .slot.sel .card { outline: 1px dashed var(--focus); }

.slot.dragging * { transition: none !important; }

/* ---------- 卡片基座 ---------- */

.card {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  text-align: left;
  transition: background-color .25s, border-color .25s, color .25s;
}

.hd { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; font-weight: 500; }

.hd-ico { flex: none; width: 20px; height: 20px; color: var(--tone); }

.hd-t {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-transform: var(--case);
  letter-spacing: var(--track-l);
}

.hd-v { flex: none; font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }

.ico {
  display: block;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

html[data-skin="electro"] .ico { stroke-width: 2.1; stroke-dasharray: .01 3.1; }

.num { font-family: var(--font-num); font-weight: var(--num-w); font-variant-numeric: tabular-nums; }

html[data-skin="electro"] .num { letter-spacing: .03em; }

.rbtn {
  flex: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--ink);
  touch-action: manipulation;
  transition: transform .15s, opacity .2s;
}

.rbtn .ico { width: 18px; height: 18px; }
.rbtn:active { transform: scale(.92); }
.rbtn:disabled { opacity: .35; cursor: default; }

html[data-skin="electro"] .rbtn { background: none; border: 1.5px dotted var(--faint); }

/* ---------- 开关：图标开关卡 ---------- */

.tile { justify-content: space-between; cursor: pointer; }
.tile:active { transform: scale(.975); }

.tile-ico {
  width: 42px;
  height: 42px;
  padding: 9px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--muted);
  transition: background-color .25s, color .25s;
}

.tile-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

.tile-copy strong {
  font-size: 15px;
  font-weight: 500;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-transform: var(--case);
  letter-spacing: var(--track-l);
}

.tile-copy small { font-size: 12px; color: var(--muted); transition: color .25s; }

.tile.wide { flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; }
.tile.wide .tile-ico { flex: none; width: 38px; height: 38px; padding: 8px; }

.tile-dot { position: absolute; top: 16px; right: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.tile.on .tile-dot { background: var(--tone); }
.tile.wide .tile-dot { top: 50%; margin-top: -4px; }

.tile-more { position: absolute; top: 14px; right: 12px; width: 18px; height: 18px; color: var(--faint); }
.tile.wide .tile-more { top: 50%; margin-top: -9px; }

.tile.st-fill.on { background: var(--tone); color: var(--on-tone); border-color: transparent; }
.tile.st-fill.on .tile-ico { background: rgba(255, 255, 255, .24); color: var(--on-tone); }
.tile.st-fill.on small, .tile.st-fill.on .tile-more { color: rgba(255, 255, 255, .8); }
.tile.st-fill.on .tile-dot { background: var(--on-tone); }

.tile.st-tint.on { background: color-mix(in srgb, var(--tone) 13%, var(--surface)); }
.tile.st-tint.on .tile-ico { background: var(--tone); color: var(--on-tone); }

.tile.st-outline.on { border-color: var(--tone); box-shadow: inset 0 0 0 1px var(--tone); }
.tile.st-outline.on .tile-ico { background: color-mix(in srgb, var(--tone) 14%, transparent); color: var(--tone); }

html[data-skin="electro"] .tile .tile-ico { background: none; border: 1.5px dotted var(--faint); }
html[data-skin="electro"] .tile.on { background: var(--surface); color: var(--ink); border-color: var(--tone); box-shadow: none; }
html[data-skin="electro"] .tile.on .tile-ico { background: none; color: var(--tone); border-color: var(--tone); }
html[data-skin="electro"] .tile.on small { color: var(--tone); }
html[data-skin="electro"] .tile.on .tile-dot { background: var(--tone); }

/* ---------- 开关：胶囊开关行 ---------- */

.rowc { flex-direction: row; align-items: center; gap: 12px; padding-block: 10px; }

.rc-ico {
  flex: none;
  width: 36px;
  height: 36px;
  padding: 8px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--tone) 14%, transparent);
  color: var(--tone);
}

.rc-ico.plain { background: none; padding: 6px 2px; width: 28px; }

html[data-skin="electro"] .rc-ico { background: none; border: 1.5px dotted var(--faint); }
html[data-skin="electro"] .rc-ico.plain { border: 0; }

.rc-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.rc-copy strong, .rc-copy small { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.rc-copy strong { font-size: 14px; font-weight: 500; text-transform: var(--case); letter-spacing: var(--track-l); }
.rc-copy small { font-size: 12px; color: var(--muted); }

.sw {
  --w: 48px; --h: 28px;
  flex: none;
  position: relative;
  width: var(--w);
  height: var(--h);
  border-radius: 999px;
  background: var(--track);
  transition: background-color .25s, border-color .25s;
}

.sw.sm { --w: 38px; --h: 22px; }
.sw.lg { --w: 58px; --h: 34px; }

.sw i {
  position: absolute;
  top: 3px;
  left: 3px;
  width: calc(var(--h) - 6px);
  height: calc(var(--h) - 6px);
  border-radius: 50%;
  background: var(--knob);
  box-shadow: var(--knob-shadow);
  transition: transform .25s cubic-bezier(.3, .7, .4, 1), background-color .25s;
}

.sw.on { background: var(--tone); }
.sw.on i { transform: translateX(calc(var(--w) - var(--h))); }

html[data-skin="electro"] .sw { background: none; border: 1.5px dotted var(--muted); }
html[data-skin="electro"] .sw i { top: 2px; left: 2px; background: var(--faint); }
html[data-skin="electro"] .sw.on { background: none; border-color: var(--ink); }
html[data-skin="electro"] .sw.on i { background: var(--ink); }

/* ---------- 开关：场景按钮 ---------- */

.actc { align-items: center; justify-content: center; gap: 10px; text-align: center; }

.act {
  position: relative;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: var(--tone);
  background: color-mix(in srgb, var(--tone) 12%, var(--surface));
  transition: background-color .25s, color .25s, transform .15s;
  touch-action: manipulation;
}

.act:active { transform: scale(.95); }
.act .ico { width: 22px; height: 22px; flex: none; }
.act span { position: relative; z-index: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.act.pill { max-width: 100%; height: 44px; padding-inline: 20px; border-radius: 999px; font-size: 14px; font-weight: 500; }
.act.circle { width: 64px; height: 64px; border-radius: 50%; }
.act.circle .ico { width: 28px; height: 28px; }
.act.block { align-self: stretch; flex: 1; flex-direction: column; border-radius: calc(var(--radius) - 8px); font-size: 14px; font-weight: 500; }
.act.block .ico { width: 30px; height: 30px; }
.act.run { background: var(--tone); color: var(--on-tone); }

.act::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--tone);
  opacity: .28;
  transform: scaleX(0);
  transform-origin: left;
}

.act.holding::after { transform: scaleX(1); transition: transform .8s linear; }

.act-t { font-size: 14px; font-weight: 500; text-transform: var(--case); letter-spacing: var(--track-l); }
.act-s { min-height: 16px; font-size: 12px; color: var(--muted); }

html[data-skin="electro"] .act { background: none; border: 1.5px dotted var(--ink); color: var(--ink); }
html[data-skin="electro"] .act.run { background: none; border-color: var(--tone); color: var(--tone); }

/* ---------- 开关：多键面板 ---------- */

.keys { flex: 1; min-height: 0; display: grid; gap: 8px; }

.keys.joined { gap: 1px; padding: 0; border-radius: var(--radius-s); overflow: hidden; background: var(--line); }

.key {
  position: relative;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: var(--radius-s);
  background: var(--surface-2);
  color: var(--muted);
  font-size: 12px;
  transition: background-color .25s, color .25s;
}

.keys.joined .key { border-radius: 0; }
.key .ico { width: 22px; height: 22px; }
.key span { text-transform: var(--case); letter-spacing: var(--track-l); }
.key.on { background: color-mix(in srgb, var(--tone) 14%, var(--surface)); color: var(--tone); }

.key-led { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.key.on .key-led { background: var(--tone); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 22%, transparent); }

html[data-skin="electro"] .keys.joined { background: var(--card-border); }
html[data-skin="electro"] .key { background: var(--surface); }
html[data-skin="electro"] .key.on { background: var(--surface); color: var(--tone); }
html[data-skin="electro"] .keys:not(.joined) .key { border: 1px dotted var(--faint); }
html[data-skin="electro"] .keys:not(.joined) .key.on { border-color: var(--tone); }

/* ---------- 开关：模式宫格 ---------- */

.modes { flex: 1; display: grid; gap: 8px; align-content: center; }

.mode {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  min-width: 0;
  font-size: 12px;
  color: var(--muted);
  transition: color .2s, background-color .2s;
}

.mode-ico {
  width: 44px;
  height: 44px;
  padding: 11px;
  border-radius: 50%;
  background: var(--surface-2);
  transition: background-color .25s, color .25s;
}

.mode.on { color: var(--ink); }
.mode.on .mode-ico { background: var(--tone); color: var(--on-tone); }
.mode .mi { width: 16px; height: 16px; flex: none; }

.modes.segmented { display: flex; gap: 2px; padding: 3px; border-radius: var(--radius-s); background: var(--surface-2); align-self: stretch; margin-top: auto; }
.modes.segmented .mode { flex: 1; flex-direction: row; justify-content: center; gap: 5px; padding: 9px 4px; border-radius: calc(var(--radius-s) - 3px); }
.modes.segmented .mode.on { background: var(--surface); color: var(--tone); box-shadow: var(--knob-shadow); }

.modes.chips { display: flex; flex-wrap: wrap; align-content: flex-end; gap: 8px; }
.modes.chips .mode { flex-direction: row; gap: 5px; padding: 7px 12px; border-radius: 999px; background: var(--surface-2); }
.modes.chips .mode.on { background: var(--tone); color: var(--on-tone); }

html[data-skin="electro"] .mode-ico { background: none; border: 1.5px dotted var(--faint); }
html[data-skin="electro"] .mode.on .mode-ico { background: none; border-color: var(--tone); color: var(--tone); }
html[data-skin="electro"] .modes.segmented { background: none; border: 1px dotted var(--faint); }
html[data-skin="electro"] .modes.segmented .mode.on { background: var(--surface-2); }
html[data-skin="electro"] .modes.chips .mode { background: none; border: 1px dotted var(--faint); }
html[data-skin="electro"] .modes.chips .mode.on { border-color: var(--tone); color: var(--tone); }
html[data-skin="electro"] .mode span { text-transform: uppercase; }

/* ---------- 调节：大块滑块 ---------- */

.lvl { padding: 0; gap: 0; }

.lvl-track {
  position: relative;
  flex: 1;
  overflow: hidden;
  border-radius: inherit;
  background: var(--track);
  cursor: grab;
  touch-action: none;
  outline-offset: -3px;
}

.lvl-fill { position: absolute; left: 0; bottom: 0; background: var(--tone); }
.lvl.v .lvl-fill { right: 0; height: calc(var(--p) * 1%); }
.lvl.h .lvl-fill { top: 0; width: calc(var(--p) * 1%); }
.lvl.grad.v .lvl-fill { background: linear-gradient(to top, color-mix(in srgb, var(--tone) 55%, var(--surface)), var(--tone)); }
.lvl.grad.h .lvl-fill { background: linear-gradient(to right, color-mix(in srgb, var(--tone) 55%, var(--surface)), var(--tone)); }

.lvl-mk { position: absolute; background: color-mix(in srgb, var(--ink) 10%, transparent); }
.lvl.v .lvl-mk { left: 30%; right: 30%; height: 2px; bottom: calc(var(--m) * 1%); border-radius: 2px; }
.lvl.h .lvl-mk { top: 30%; bottom: 30%; width: 2px; left: calc(var(--m) * 1%); border-radius: 2px; }

.lvl-ico, .lvl-t, .lvl-val { position: absolute; color: var(--ink); transition: color .2s; pointer-events: none; }
.lvl-ico { width: 26px; height: 26px; color: var(--muted); }
.lvl .inv { color: var(--on-tone); }

.lvl.v .lvl-ico { left: 50%; bottom: 18px; transform: translateX(-50%); }
.lvl.v .lvl-val { top: 16px; left: 0; right: 0; text-align: center; font-size: 30px; line-height: 1; }
.lvl.v .lvl-t { top: 52px; left: 0; right: 0; text-align: center; font-size: 12px; }

.lvl.h .lvl-ico { left: 16px; top: 50%; transform: translateY(-50%); }
.lvl.h .lvl-t { left: 52px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 500; }
.lvl.h .lvl-val { right: 18px; top: 50%; transform: translateY(-50%); font-size: 24px; }

.lvl-t { text-transform: var(--case); letter-spacing: var(--track-l); }
.lvl-val small { font-size: .5em; margin-left: 2px; }

html[data-skin="electro"] .lvl-track { background: radial-gradient(circle, var(--faint) 1.5px, transparent 2px) left bottom / 8px 8px; }
html[data-skin="electro"] .lvl-fill, html[data-skin="electro"] .lvl.grad .lvl-fill { background: radial-gradient(circle, var(--tone) 1.9px, transparent 2.4px) left bottom / 8px 8px; }
html[data-skin="electro"] .lvl .inv { color: var(--ink); }
html[data-skin="electro"] .lvl-mk { background: var(--muted); }

/* ---------- 调节：渐变滑块 ---------- */

.gs-wrap { position: relative; margin-top: auto; }
.gs-wrap.h-thin { height: 6px; margin-block: auto 12px; }
.gs-wrap.h-mid { height: 14px; margin-block: auto 8px; }
.gs-wrap.h-thick { height: 32px; }

.gs-track {
  position: relative;
  height: 100%;
  border-radius: 999px;
  cursor: pointer;
  touch-action: none;
}

.gs-track.cct { background: linear-gradient(90deg, #FFA54F, #FFD9A8 38%, #FFF6EA 58%, #E4EEFF 78%, #A9CBFF); }
.gs-track.hue { background: linear-gradient(90deg, #F33, #FF0 17%, #3F3 33%, #3FF 50%, #33F 67%, #F3F 83%, #F33); }
.gs-track.bright { background: linear-gradient(90deg, #3A3A3C, #FFF4D6); }

.gs-knob {
  position: absolute;
  top: 50%;
  left: calc(var(--p) * 1%);
  width: 26px;
  height: 26px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events: none;
}

.gs-knob.ring { border: 4px solid var(--knob); box-shadow: var(--knob-shadow), inset var(--knob-shadow); }
.gs-knob.dot { background: var(--knob); box-shadow: var(--knob-shadow); }
.gs-knob.bar { width: 8px; height: calc(100% + 14px); border-radius: 4px; background: var(--knob); box-shadow: var(--knob-shadow); }

.gs-ticks { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

.gs-val { font-size: 22px; line-height: 1; }
.gs-val small { font-size: 12px; color: var(--muted); margin-left: 2px; }

html[data-skin="electro"] .gs-track {
  border-radius: 0;
  -webkit-mask: radial-gradient(circle, #000 1.7px, transparent 2.2px) left center / 6px 6px;
  mask: radial-gradient(circle, #000 1.7px, transparent 2.2px) left center / 6px 6px;
}

html[data-skin="electro"] .gs-knob { display: none; }

.gs-mark { position: absolute; top: 50%; left: calc(var(--p) * 1%); width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--tone); box-shadow: 0 0 0 4px var(--surface); display: none; pointer-events: none; }
html[data-skin="electro"] .gs-mark { display: block; }

/* ---------- 调节：环形旋钮 / 环形进度 ---------- */

.dl-wrap { position: relative; flex: 1; min-height: 0; }

.dl-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; touch-action: none; cursor: grab; }

.arc-track { fill: none; stroke: var(--track); stroke-linecap: round; }
.arc-prog { fill: none; stroke: var(--tone); stroke-linecap: round; }
.arc-tick { stroke: var(--faint); stroke-width: 1.6; stroke-linecap: round; }
.arc-tick.on { stroke: var(--tone); }
.arc-knob { fill: var(--knob); stroke: var(--tone); stroke-width: 3; }
.arc-prog.warn { stroke: var(--warn); }

html[data-skin="electro"] .arc-track { stroke: var(--faint); }
html[data-skin="electro"] .arc-knob { fill: var(--tone); stroke: var(--surface); }

.dl-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.dl-num { display: flex; align-items: flex-start; font-size: clamp(38px, 4.6vw, 56px); line-height: 1; }
.dl-num sup { font-family: var(--font-ui); font-weight: 400; font-size: 14px; margin: .3em 0 0 3px; color: var(--muted); }
.dl-sub { margin-top: 8px; font-size: 12px; color: var(--muted); text-transform: var(--case); letter-spacing: var(--track-l); }
.dl-btns { display: flex; align-items: center; justify-content: space-between; }
.dl-range { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.rg-center .dl-num { font-size: clamp(26px, 3vw, 34px); }
.rg-foot { margin: 0; text-align: center; }
.rg-center.half { justify-content: flex-end; padding-bottom: 4px; }
.rg-center.warn .dl-num { color: var(--warn); }

/* ---------- 调节：档位 ---------- */

.lv-row { flex: 1; min-height: 0; display: flex; align-items: center; gap: 10px; }
.lv-row > :not(.rbtn) { flex: 1; min-width: 0; align-self: stretch; }

.lv-row > .lv-seg { align-self: center; height: 44px; }

.lv-bars { display: flex; align-items: flex-end; gap: 8px; height: 100%; }

.lv-bar {
  flex: 1;
  height: calc(var(--h) * 1%);
  border-radius: 7px;
  background: var(--track);
  transition: background-color .2s;
}

.lv-bar.on { background: var(--tone); }

html[data-skin="electro"] .lv-bar { border-radius: 0; background: radial-gradient(circle, var(--faint) 1.8px, transparent 2.3px) center bottom / 7px 7px; }
html[data-skin="electro"] .lv-bar.on { background: radial-gradient(circle, var(--tone) 2px, transparent 2.5px) center bottom / 7px 7px; }

.lv-dots { display: flex; align-items: center; justify-content: space-between; gap: 6px; }

.lv-dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 12px;
  color: var(--muted);
  background: var(--surface-2);
  transition: background-color .2s, color .2s;
}

.lv-dot.on { background: var(--tone); color: var(--on-tone); }
.lv-gap { flex: 1; height: 2px; border-radius: 2px; background: var(--track); }
.lv-gap.on { background: var(--tone); }

html[data-skin="electro"] .lv-dot { background: none; border: 1.5px dotted var(--faint); }
html[data-skin="electro"] .lv-dot.on { border-color: var(--tone); color: var(--tone); background: none; }
html[data-skin="electro"] .lv-gap { background: none; border-top: 2px dotted var(--faint); height: 0; }
html[data-skin="electro"] .lv-gap.on { border-color: var(--tone); }

.lv-seg { display: flex; gap: 2px; padding: 3px; border-radius: var(--radius-s); background: var(--surface-2); align-items: stretch; }

.lv-seg button {
  flex: 1;
  min-width: 0;
  padding-inline: 2px;
  border-radius: calc(var(--radius-s) - 3px);
  font-size: 13px;
  color: var(--muted);
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.lv-seg button.on { background: var(--surface); color: var(--tone); box-shadow: var(--knob-shadow); font-weight: 500; }

html[data-skin="electro"] .lv-seg { background: none; border: 1px dotted var(--faint); }
html[data-skin="electro"] .lv-seg button.on { background: var(--surface-2); }

/* ---------- 调节：色盘 ---------- */

.cw-wrap { flex: 1; min-height: 0; display: grid; place-items: center; }

.cw-box {
  position: relative;
  height: 100%;
  max-width: 100%;
  aspect-ratio: 1;
  container-type: size;
  border-radius: 50%;
  cursor: grab;
  touch-action: none;
}

.cw {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: conic-gradient(#F33, #FF0, #3F3, #3FF, #33F, #F3F, #F33);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--rw)), #000 calc(100% - var(--rw) + .5px));
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--rw)), #000 calc(100% - var(--rw) + .5px));
  pointer-events: none;
}

html[data-skin="electro"] .cw {
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--rw)), #000 calc(100% - var(--rw) + .5px)), radial-gradient(circle, #000 1.6px, transparent 2.1px) center / 6px 6px;
  -webkit-mask-composite: source-in;
  mask: radial-gradient(farthest-side, transparent calc(100% - var(--rw)), #000 calc(100% - var(--rw) + .5px)) intersect, radial-gradient(circle, #000 1.6px, transparent 2.1px) center / 6px 6px;
}

.cw-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: calc(var(--rw) + 8px);
  height: calc(var(--rw) + 8px);
  margin: calc((var(--rw) + 8px) / -2) 0 0 calc((var(--rw) + 8px) / -2);
  border-radius: 50%;
  border: 3px solid var(--knob);
  box-shadow: var(--knob-shadow), 0 0 0 1px rgba(0, 0, 0, .06);
  transform: rotate(var(--a)) translateY(calc(-50cqmin + var(--rw) / 2)) rotate(calc(var(--a) * -1));
  pointer-events: none;
}

.cw-mid {
  position: absolute;
  inset: calc(var(--rw) + 14px);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--c);
  font-family: var(--font-mono);
  font-size: 12px;
  pointer-events: none;
  transition: background-color .15s;
}

.cw-mid.lt { color: rgba(0, 0, 0, .62); }
.cw-mid.dk { color: rgba(255, 255, 255, .9); }

html[data-skin="electro"] .cw-mid {
  background: radial-gradient(circle, var(--c) 2.4px, transparent 2.9px) center / 8px 8px;
  color: var(--ink);
}

.sws { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

.swc {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--c);
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
  transition: transform .15s;
}

.swc.on { outline: 2px solid var(--ink); outline-offset: 2px; }
.sws.big { flex: 1; align-content: center; gap: 12px; }
.sws.big .swc { width: 36px; height: 36px; }

html[data-skin="electro"] .swc { border-radius: 2px; }

/* ---------- 显示 ---------- */

.bn { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; min-height: 0; }

.bn-num { display: flex; align-items: flex-start; gap: 3px; line-height: .95; letter-spacing: -.02em; }
.bn.md .bn-num { font-size: 34px; }
.bn.lg .bn-num { font-size: 48px; }
.bn.xl .bn-num { font-size: 66px; }
.bn.warn .bn-num { color: var(--warn); }

.bn-u { font-family: var(--font-ui); font-weight: 400; font-size: 14px; color: var(--muted); margin-top: .2em; letter-spacing: 0; }
.bn-u.base { align-self: flex-end; margin: 0 0 .25em; }

.bn-sub { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 12px; color: var(--muted); }
.bn-sub span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.delta { flex: none; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); font-family: var(--font-mono); font-size: 11px; }

html[data-skin="electro"] .delta { background: none; border: 1px dotted var(--faint); border-radius: 3px; }

.sp-top { display: flex; align-items: center; gap: 8px; }
.sp-last { font-size: 24px; line-height: 1; }
.sp-last small { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-left: 2px; font-weight: 400; }

.sp-plot { position: relative; flex: 1; min-height: 0; }
.sp-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

.sp-grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.sp-line { fill: none; stroke: var(--tone); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.sp-area { fill: color-mix(in srgb, var(--tone) 15%, transparent); }
.sp-bar { fill: color-mix(in srgb, var(--tone) 45%, transparent); }
.sp-bar.last { fill: var(--tone); }

.sp-end {
  position: absolute;
  width: 9px;
  height: 9px;
  margin: -4.5px 0 0 -4.5px;
  border-radius: 50%;
  background: var(--tone);
  box-shadow: 0 0 0 3px var(--surface);
}

.sp-cols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }

.sp-col {
  flex: 1;
  height: calc(var(--h) * 1%);
  background: radial-gradient(circle, var(--muted) 1.5px, transparent 2px) center bottom / 100% 6px;
}

.sp-col.peak { background: radial-gradient(circle, var(--ink) 2px, transparent 2.5px) center top / 100% 6px no-repeat, radial-gradient(circle, var(--faint) 1.3px, transparent 1.8px) center bottom / 100% 6px; }
.sp-col.last { background: radial-gradient(circle, var(--tone) 2px, transparent 2.5px) center bottom / 100% 6px; }
.sp-col.peak.last { background: radial-gradient(circle, var(--tone) 2.4px, transparent 2.9px) center top / 100% 6px no-repeat, radial-gradient(circle, var(--faint) 1.3px, transparent 1.8px) center bottom / 100% 6px; }

.sp-ax { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

.st { justify-content: center; }
.st.inline { flex-direction: row; align-items: center; }
.st.inline .hd { flex: 1; }

.st-line { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 18px; font-weight: 500; }
.st.inline .st-line { font-size: 14px; }
.st-line > span { text-transform: var(--case); letter-spacing: var(--track-l); }

.st-dot { position: relative; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--sc); }

.st-dot.pulse::after {
  content: "";
  position: absolute;
  inset: -5px;
  border-radius: 50%;
  border: 2px solid var(--sc);
  opacity: 0;
  animation: pulse 1.8s ease-out infinite;
}

@keyframes pulse {
  0% { transform: scale(.5); opacity: .7; }
  100% { transform: scale(1.4); opacity: 0; }
}

.st-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--sc) 15%, transparent);
  color: var(--sc);
  font-size: 13px;
  font-weight: 500;
}

.st-pill .st-dot { width: 7px; height: 7px; }
.st-meta { font-size: 12px; color: var(--muted); }

.st.banner { background: color-mix(in srgb, var(--sc) 12%, var(--surface)); border-color: color-mix(in srgb, var(--sc) 30%, transparent); }
.st.banner .hd-ico { color: var(--sc); }

html[data-skin="electro"] .st-dot.hollow { background: none; border: 1.5px solid var(--muted); }
html[data-skin="electro"] .st-pill { background: none; border: 1px dotted var(--sc); border-radius: 4px; text-transform: uppercase; }
html[data-skin="electro"] .st.banner { background: var(--surface); border-color: var(--sc); border-style: dotted; }

.sm-grid { flex: 1; display: grid; align-content: center; gap: 14px 0; }

.sm-it { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-inline: 14px; }
.sm-it.first { padding-left: 0; }
.sm-grid.div .sm-it:not(.first) { border-left: 1px solid var(--line); }

.sm-v { font-size: 24px; line-height: 1; white-space: nowrap; }
.sm-v small { font-family: var(--font-ui); font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 2px; }
.sm-l { font-size: 12px; color: var(--muted); text-transform: var(--case); letter-spacing: var(--track-l); }
.sm-it.em .sm-v { font-size: 34px; color: var(--tone); }

html[data-skin="electro"] .sm-grid.div .sm-it:not(.first) { border-left-style: dotted; border-left-color: var(--faint); }

/* ---------- 输入 ---------- */

.ns { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 0; }
.ns-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ns-v { font-size: 40px; line-height: 1; }
.ns-v small { font-family: var(--font-ui); font-weight: 400; font-size: 14px; color: var(--muted); margin-left: 3px; }
.ns-v.ns-sm { flex: none; min-width: 3.2ch; text-align: center; font-size: 24px; }
.ns-range { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

.ns.split { flex-direction: column; align-items: stretch; }
.ns.split .ns-mid { flex: 1; justify-content: center; }
.ns-row { display: flex; gap: 10px; }
.ns-row .rbtn { flex: 1; height: 38px; border-radius: 12px; }

.tx-row { display: flex; align-items: flex-end; gap: 8px; margin-top: auto; }

.tx-in {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: var(--surface-2);
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  resize: none;
}

.tx-in:focus { outline: none; border-color: var(--focus); }
.tx-in::placeholder { color: var(--muted); }

.tx-send {
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  height: 41px;
  padding-inline: 14px;
  border-radius: 12px;
  background: var(--tone);
  color: var(--on-tone);
  font-size: 13px;
  font-weight: 500;
}

.tx-send .ico { width: 16px; height: 16px; }
.tx-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--muted); }
.tx-log { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tx-count { font-family: var(--font-mono); flex: none; }

html[data-skin="electro"] .tx-in { background: none; border: 0; border-bottom: 1.5px dotted var(--faint); border-radius: 0; padding-inline: 2px; }
html[data-skin="electro"] .tx-in:focus { border-bottom-color: var(--tone); }
html[data-skin="electro"] .tx-send { background: none; border: 1.5px dotted var(--tone); color: var(--tone); text-transform: uppercase; }

.tm-presets { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; margin-top: auto; }

.tm-p {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding-block: 10px;
  border-radius: var(--radius-s);
  background: var(--surface-2);
  font-size: 11px;
  color: var(--muted);
}

.tm-p b { font-family: var(--font-num); font-weight: 500; font-size: 20px; color: var(--ink); }

html[data-skin="electro"] .tm-p { background: none; border: 1px dotted var(--faint); }
html[data-skin="electro"] .tm-p b { font-weight: 800; }

.tm-run { flex: 1; min-height: 0; display: flex; align-items: center; gap: 14px; }
.tm-ring { flex: none; width: 64px; height: 64px; }
.tm-copy { min-width: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.tm-time { font-size: 34px; line-height: 1; }
.tm-act { font-size: 12px; color: var(--muted); }
.tm-bar { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.tm-bar span { display: block; height: 100%; background: var(--tone); border-radius: inherit; transition: width .9s linear; }
.tm-x { flex: none; font-size: 12px; color: var(--tone); padding: 4px 2px; }

html[data-skin="electro"] .tm-bar { background: radial-gradient(circle, var(--faint) 1.5px, transparent 2px) left center / 6px 6px; border-radius: 0; }
html[data-skin="electro"] .tm-bar span { background: radial-gradient(circle, var(--tone) 1.8px, transparent 2.3px) left center / 6px 6px; }

/* ---------- 检查器 ---------- */

.insp {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  max-height: calc(100vh - 32px);
  overflow: auto;
  padding: 18px;
  background: var(--surface);
  border: 1px solid var(--card-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.ih { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.ih h2 { margin: 2px 0 0; font-size: 18px; font-weight: 600; text-transform: var(--case); letter-spacing: var(--track-l); }
.eyebrow { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.ib { margin: 8px 0 14px; font-size: 12px; line-height: 1.6; color: var(--muted); }
.ib b { color: var(--ink); font-weight: 500; }

.grab { display: none; }

.group { display: grid; gap: 12px; padding-block: 14px; border-top: 1px solid var(--line); }

.group h3 {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}

.f { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 10px; font-size: 13px; }
.f > label, .f > .fl { color: var(--muted); line-height: 1.35; }
.f.top { align-items: start; }
.f.top > .fl { padding-top: 6px; }

.in {
  width: 100%;
  min-width: 0;
  padding: 7px 10px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: var(--surface-2);
  font: inherit;
  font-size: 13px;
  color: var(--ink);
}

.in:focus { outline: none; border-color: var(--focus); }

.sg { display: flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 10px; background: var(--surface-2); }

.sg button {
  flex: 1 0 auto;
  padding: 5px 8px;
  border-radius: 7px;
  font-size: 12px;
  color: var(--muted);
}

.sg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--knob-shadow); }

html[data-skin="electro"] .sg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

function decimalsOf(step) {
  const text = String(step);
  return text.includes('.') ? text.split('.')[1].length : 0;
}

function snap(value, min, max, step) {
  const snapped = Math.round((value - min) / step) * step + min;
  return Number(clamp(snapped, min, max).toFixed(decimalsOf(step)));
}

/* ============ 卡片片段 ============ */

function card(props, cls, inner, tag = 'div', attrs = '', style = '') {
  return `<${tag} class="card ${cls}" style="--tone:var(--t-${props.tone});${style}" ${attrs}>${inner}</${tag}>`;

function head(props, right = '') {
  if (props.showTitle === false) return right ? `<div class="hd"><span class="hd-t"></span>${right}</div>` : '';
  const icon = props.icon ? `<span class="hd-ico">${ico(props.icon)}</span>` : '';
  return `<div class="hd">${icon}<span class="hd-t">${esc(props.title)}</span>${right}</div>`;
}

/* ============ 弧线 ============ */

function polar(cx, cy, r, angle) {
  const radians = (angle - 90) * Math.PI / 180;
  return [cx + r * Math.cos(radians), cy + r * Math.sin(radians)];
}

function arc(cx, cy, r, start, end) {
  const finish = Math.min(Math.max(end, start + .01), start + 359.99);
  const [x0, y0] = polar(cx, cy, r, start);
  const [x1, y1] = polar(cx, cy, r, finish);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${finish - start > 180 ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

const dotted = width => isElectro() ? ` stroke-dasharray="0.01 ${(width * 1.75).toFixed(1)}"` : '';

/* ============ 颜色 ============ */

function hexToHsl(hex) {
  const value = parseInt(hex.slice(1), 16);
  const r = (value >> 16 & 255) / 255, g = (value >> 8 & 255) / 255, b = (value & 255) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l * 100];
  const d = max - min;
  const s = l > .5 ? d / (2 - max - min) : d / (max + min);
  const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s * 100, l * 100];
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return '#' + [f(0), f(8), f(4)].map(c => c.toString(16).padStart(2, '0')).join('').toUpperCase();
}

function isLight(hex) {
  const value = parseInt(hex.slice(1), 16);
  return (0.299 * (value >> 16 & 255) + 0.587 * (value >> 8 & 255) + 0.114 * (value & 255)) > 170;
}

/* ============ 图表与解析 ============ */

function smoothPath(points) {
  let d = `M${points[0][0]},${points[0][1]}`;
  for (let index = 0; index < points.length - 1; index += 1) {
    const p0 = points[index - 1] || points[index], p1 = points[index], p2 = points[index + 1], p3 = points[index + 2] || p2;
    d += `C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
  }
  return d;
}

function svgPlot(p, series, min, span) {
  const n = series.length;
  const points = series.map((value, index) => [index / (n - 1) * 300, 90 - (value - min) / span * 78]);
  const grid = [12, 51, 90].map(y => `<line class="sp-grid" x1="0" x2="300" y1="${y}" y2="${y}"/>`).join('');
  let marks;
  if (p.chart === 'bars') {
    const width = 300 / n;
    marks = series.map((value, index) => {
      const height = 10 + (value - min) / span * 80;
      return `<rect class="sp-bar ${index === n - 1 ? 'last' : ''}" x="${(index * width + width * .2).toFixed(2)}" y="${(100 - height).toFixed(2)}" width="${(width * .6).toFixed(2)}" height="${height.toFixed(2)}" rx="1.5"/>`;
    }).join('');
  } else {
    const line = p.chart === 'steps'
      ? points.reduce((d, [x, y], index) => index ? `${d}H${x}V${y}` : `M${x},${y}`, '')
      : p.smooth ? smoothPath(points) : points.map(([x, y], index) => `${index ? 'L' : 'M'}${x},${y}`).join('');
    const area = p.chart === 'area' ? `<path class="sp-area" d="${line}L300,100L0,100Z"/>` : '';
    marks = `${area}<path class="sp-line" d="${line}"/>`;
  }
  const [ex, ey] = points[n - 1];
  const end = p.chart === 'bars' ? '' : `<i class="sp-end" style="left:${ex / 3}%;top:${ey}%"></i>`;
  return `<svg class="sp-svg" viewBox="0 0 300 100" preserveAspectRatio="none" aria-hidden="true">${grid}${marks}</svg>${end}`;
}

function dotPlot(p, series, min, span) {
  const columns = series.map((value, index) => {
    const height = 14 + (value - min) / span * 86;
    const kind = p.chart === 'line' || p.chart === 'steps' ? 'peak' : '';
    return `<i class="sp-col ${kind} ${index === series.length - 1 ? 'last' : ''}" style="--h:${height.toFixed(1)}"></i>`;
  }).join('');
  return `<div class="sp-cols" style="gap:${p.chart === 'bars' ? 4 : 1}px" aria-hidden="true">${columns}</div>`;
}

function parseItems(text) {
  return csv(text).map(part => {
    const [label = '', raw = '0', unit = ''] = part.split(':');
    const value = Number(raw);
    return { label, unit, value: Number.isFinite(value) ? value : 0, decimals: decimalsOf(raw) };
  });
}

function clock(seconds) {
  const hours = Math.floor(seconds / 3600), minutes = Math.floor(seconds % 3600 / 60), rest = seconds % 60;
  return hours ? `${hours}:${pad(minutes)}:${pad(rest)}` : `${pad(minutes)}:${pad(rest)}`;
}

/* ============ 状态 ============ */

const items = SPECS.map((spec, index) => ({
  id: `c${index + 1}`,
  index: index + 1,
  spec,
  props: { ...spec.props },
  value: structuredClone(spec.value),
}));

const byId = id => items.find(item => item.id === id);
let selected = items[0];

const gallery = $('#gallery');
const inspector = $('#insp');

/* ============ 画廊 ============ */

function slotHTML(it) {
  return `<div class="slot ${it === selected ? 'sel' : ''}" data-id="${it.id}" data-span="${it.props.span}" style="--s:${it.props.span};--r:${it.props.rows}">
      <div class="cardwrap">${it.spec.render(it.props, it.value, it)}</div>
      <div class="cap"><b>C${pad(it.index)}</b>${it.spec.name}<b>·</b>${it.spec.type}</div>
    </div>`;
}

function renderGallery() {
  gallery.innerHTML = CATEGORIES.map(([cat, name, english]) => {
    const group = items.filter(it => it.spec.cat === cat);
    const label = isElectro() ? `${english} · ${name}` : name;
    return `<section class="sec"><h2 class="sec-h">${label}<small>${pad(group.length)}</small></h2><div class="grid">${group.map(slotHTML).join('')}</div></section>`;
  }).join('');
}

function rerender(it) {
  const slot = gallery.querySelector(`.slot[data-id="${it.id}"]`);
  if (!slot) return;
  const active = document.activeElement;
  const focusKey = active && slot.contains(active) ? focusSelector(active) : null;

  slot.dataset.span = it.props.span;
  slot.style.setProperty('--s', it.props.span);
  slot.style.setProperty('--r', it.props.rows);
  slot.querySelector('.cardwrap').innerHTML = it.spec.render(it.props, it.value, it);

  if (focusKey) slot.querySelector(focusKey)?.focus({ preventScroll: true });
  if (it === selected) renderJson();
}

function focusSelector(element) {
  if (element.id) return `#${element.id}`;
  for (const name of ['drag', 'act', 'repeat', 'hold']) {
    if (element.dataset[name]) {
      return `[data-${name}="${element.dataset[name]}"]${element.dataset.i !== undefined ? `[data-i="${element.dataset.i}"]` : ''}`;
    }
  }
  return null;
}

function select(it) {
  if (selected === it) return;
  gallery.querySelector('.slot.sel')?.classList.remove('sel');
  selected = it;
  gallery.querySelector(`.slot[data-id="${it.id}"]`)?.classList.add('sel');
  renderInspector();
}

/* ---------- 交互：点击、拖动、长按、连按 ---------- */

let drag = null;
let hold = null;

function applyDrag(event) {
  const target = drag.slot.querySelector(`[data-drag="${drag.name}"]`);
  if (!target) return;
  const rect = target.getBoundingClientRect();
  const x = event.clientX - rect.left, y = event.clientY - rect.top;
  drag.it.spec.drag(drag.it, { x, y, w: rect.width, h: rect.height, fx: x / rect.width, fy: y / rect.height });
  rerender(drag.it);
}

function stopHold() {
  if (!hold) return;
  clearTimeout(hold.timer);
  clearInterval(hold.interval);
  hold.element?.classList.remove('holding');
  hold = null;
}

function runAct(it, name, data) {
  const handler = it.spec.act?.[name];
  if (!handler) return;
  handler(it, data);
  rerender(it);
}

gallery.addEventListener('pointerdown', event => {
  const slot = event.target.closest('.slot');
  if (!slot) return;
  const it = byId(slot.dataset.id);
  select(it);

  const dragTarget = event.target.closest('[data-drag]');
  if (dragTarget) {
    drag = { it, slot, name: dragTarget.dataset.drag };
    slot.setPointerCapture(event.pointerId);
    slot.classList.add('dragging');
    applyDrag(event);
    event.preventDefault();
    return;
  }

  const holdTarget = event.target.closest('[data-hold]');
  if (holdTarget) {
    holdTarget.classList.add('holding');
    hold = { element: holdTarget, timer: setTimeout(() => { stopHold(); runAct(it, holdTarget.dataset.hold, {}); }, 800) };
    return;
  }

  const repeatTarget = event.target.closest('[data-repeat]');
  if (repeatTarget && !repeatTarget.disabled) {
    const name = repeatTarget.dataset.repeat;
    runAct(it, name, {});
    if (it.props.longPress !== false) {
      hold = { timer: setTimeout(() => { hold.interval = setInterval(() => runAct(it, name, {}), 70); }, 380) };
    }
  }
});

gallery.addEventListener('pointermove', event => { if (drag) applyDrag(event); });

for (const type of ['pointerup', 'pointercancel']) {
  window.addEventListener(type, () => {
    stopHold();
    if (drag) { drag.slot.classList.remove('dragging'); drag = null; }
  });
}

gallery.addEventListener('click', event => {
  const slot = event.target.closest('.slot');
  if (!slot) return;
  const it = byId(slot.dataset.id);
  const repeatTarget = event.target.closest('[data-repeat]');
  if (repeatTarget && event.detail === 0) return runAct(it, repeatTarget.dataset.repeat, {});
  const holdTarget = event.target.closest('[data-hold]');
  if (holdTarget && event.detail === 0) return runAct(it, holdTarget.dataset.hold, {});
  const actTarget = event.target.closest('[data-act]');
  if (actTarget) runAct(it, actTarget.dataset.act, { ...actTarget.dataset });
});

gallery.addEventListener('keydown', event => {
  const slot = event.target.closest('.slot');
  if (!slot) return;
  const it = byId(slot.dataset.id);
  if (event.target.matches('[data-drag]') && it.spec.nudge) {
    const direction = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[event.key];
    if (direction) { event.preventDefault(); it.spec.nudge(it, direction); rerender(it); }
  }
  if (event.target.matches('input.tx-in') && event.key === 'Enter') runAct(it, 'send', {});
  if (event.target.matches('[role="button"][data-act]') && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    runAct(it, event.target.dataset.act, {});
  }
});

gallery.addEventListener('focusin', event => {
  const slot = event.target.closest('.slot');
  if (slot) select(byId(slot.dataset.id));
});

gallery.addEventListener('input', event => {
  if (!event.target.matches('.tx-in')) return;
  const it = byId(event.target.closest('.slot').dataset.id);
  it.value.draft = event.target.value;
  const counter = event.target.closest('.card').querySelector('.tx-count');
  if (counter) counter.textContent = `${[...it.value.draft].length}/${it.props.maxLength}`;
});

/* ============ 检查器 ============ */

function commonSchema(it) {
  const spec = it.spec;
  return [
    { k: 'title', label: '标题', kind: 'text' },
    ...('showTitle' in spec.props ? [{ k: 'showTitle', label: '显示标题', kind: 'bool' }] : []),
    { k: 'icon', label: '图标', kind: 'icon' },
    { k: 'tone', label: '色调', kind: 'tone' },
    { k: 'span', label: '宽度', kind: 'seg', opts: spec.spans.map(value => [value, `${value} 栏`]) },
    { k: 'rows', label: '高度', kind: 'seg', opts: spec.rowsOpts.map(value => [value, `${value} 行`]) },
  ];
}

function fieldHTML(it, def) {
  const value = it.props[def.k];
  const id = `p-${def.k}`;
  const hint = def.hint ? ` title="${esc(def.hint)}"` : '';
  if (def.kind === 'text' || def.kind === 'num') {
    const type = def.kind === 'num' ? 'number' : 'text';
    return `<div class="f"><label for="${id}">${def.label}</label><input class="in" id="${id}" type="${type}" step="any" data-prop="${def.k}" value="${esc(value)}" placeholder="${esc(def.hint || '')}"${hint}></div>`;
  }
  if (def.kind === 'bool') {
    return `<div class="f"><span class="fl" id="${id}">${def.label}</span><button type="button" class="sw sm ${value ? 'on' : ''}" role="switch" aria-checked="${!!value}" aria-labelledby="${id}" data-prop="${def.k}" data-bool><i></i></button></div>`;
  }
  if (def.kind === 'range') {
    return `<div class="f"><label for="${id}">${def.label}</label><div class="rg"><input id="${id}" type="range" min="${def.min}" max="${def.max}" step="${def.step}" value="${value}" data-prop="${def.k}"><output>${value}</output></div></div>`;
  }
  if (def.kind === 'seg') {
    const buttons = def.opts.map(([option, label]) => `<button type="button" data-prop="${def.k}" data-val="${option}" aria-pressed="${String(option) === String(value)}">${label}</button>`).join('');
    return `<div class="f"><span class="fl">${def.label}</span><div class="sg" role="group" aria-label="${def.label}">${buttons}</div></div>`;
  }
  if (def.kind === 'icon') {
    const buttons = ICON_PICK.map(name => `<button type="button" data-prop="${def.k}" data-val="${name}" aria-pressed="${name === value}" aria-label="${name}">${ico(name)}</button>`).join('');
    return `<div class="f top"><span class="fl">${def.label}</span><div class="icons">${buttons}</div></div>`;
  }
  if (def.kind === 'tone') {
    const buttons = TONES.map(([name, label]) => `<button type="button" data-prop="${def.k}" data-val="${name}" aria-pressed="${name === value}" aria-label="${label}" title="${label}" style="--c:var(--t-${name})"></button>`).join('');
    return `<div class="f"><span class="fl">${def.label}</span><div class="tones">${buttons}</div></div>`;
  }
  return '';
}

function renderInspector() {
  const it = selected;
  const open = inspector.classList.contains('open');
  inspector.innerHTML = `
    <div class="ih" data-sheet>
      <div><div class="eyebrow">C${pad(it.index)} · type: ${it.spec.type}</div><h2>${it.spec.name}</h2></div>
      <span class="grab" aria-hidden="true"></span>
    </div>
    <p class="ib">绑定字段 <b>${it.spec.bind}</b>${isElectro() ? '<br>电子主题下全部色调统一为信号红。' : ''}</p>
    <div class="group"><h3>通用</h3>${commonSchema(it).map(def => fieldHTML(it, def)).join('')}</div>
    <div class="group"><h3>专属参数</h3>${it.spec.schema.map(def => fieldHTML(it, def)).join('')}</div>
    <div class="group"><h3>PageLayout widget</h3><pre class="json" id="json"></pre>
      <p class="note">props 为协议扩展草案；grid.x / y 由布局决定，此处固定为 0。</p></div>`;
  inspector.classList.toggle('open', open);
  renderJson();
}

function renderJson() {
  const it = selected;
  const { title, span, rows, ...rest } = it.props;
  const widget = {
    widgetId: `w-${it.spec.key}`,
    type: it.spec.type,
    endpointKey: it.spec.key,
    title,
    grid: { x: 0, y: 0, width: span, height: rows },
    props: rest,
  };
  const json = esc(JSON.stringify(widget, null, 2))
    .replace(/&quot;([^&]+?)&quot;:/g, '<span class="k">"$1"</span>:')
    .replace(/: &quot;(.*?)&quot;/g, ': <span class="s">"$1"</span>');
  const target = $('#json', inspector);
  if (target) target.innerHTML = json;
}

function allSchema(it) {
  return [...commonSchema(it), ...it.spec.schema];
}

function setProp(key, raw, rebuild) {
  const it = selected;
  const def = allSchema(it).find(entry => entry.k === key);
  if (!def) return;
  const previous = it.props[key];
  let value = raw;

  if (def.kind === 'seg') value = def.opts.find(([option]) => String(option) === String(raw))?.[0] ?? previous;
  if (def.kind === 'num' || def.kind === 'range') {
    if (raw === '' && def.allowEmpty) value = '';
    else if (raw === '' || !Number.isFinite(Number(raw))) return;
    else value = Number(raw);
  }
  if (def.kind === 'num' && ['step', 'maxLength'].includes(key) && value <= 0) return;
  if (key === 'max' && value <= it.props.min) return;
  if (key === 'min' && value >= it.props.max) return;

  it.props[key] = value;
  it.spec.onProp?.(it, key, previous);
  rerender(it);
  if (rebuild) renderInspector();
}

inspector.addEventListener('click', event => {
  if (event.target.closest('[data-sheet]')) {
    inspector.classList.toggle('open');
    return;
  }
  const target = event.target.closest('[data-prop]');
  if (!target || target.matches('input')) return;
  if (target.hasAttribute('data-bool')) setProp(target.dataset.prop, !selected.props[target.dataset.prop], true);
  else setProp(target.dataset.prop, target.dataset.val, true);
});

inspector.addEventListener('input', event => {
  const target = event.target.closest('input[data-prop]');
  if (!target) return;
  if (target.type === 'range') target.nextElementSibling.textContent = target.value;
  setProp(target.dataset.prop, target.value, false);
});

/* ============ 主题 ============ */

const SKINS = [
  { id: 'natural', name: '自然', dot: '#3482FF', bg: '#FFFFFF', spec: '背景 #F2F3F5 · 卡片 #FFFFFF · 主色按色调 · 圆角 22 · 8 栏栅格' },
  { id: 'electro', name: '电子', dot: '#FF3B30', bg: '#070809', spec: 'BG #070809 · SURFACE #0F1113 · RED #FF3B30 · DOT GRID 8PX · RADIUS 14' },
  { id: 'dark', name: '暗夜', dot: '#4D93FF', bg: '#1B1C20', spec: '背景 #0C0D0F · 卡片 #1B1C20 · 主色按色调提亮 · 圆角 22' },
];

function renderSkins() {
  const current = document.documentElement.dataset.skin;
  $('#skins').innerHTML = SKINS.map(skin => `<button type="button" data-skin="${skin.id}" aria-pressed="${skin.id === current}">
      <i style="background:radial-gradient(circle at 50% 50%, ${skin.dot} 34%, ${skin.bg} 38%)"></i>${skin.name}</button>`).join('');
  $('#spec').textContent = SKINS.find(skin => skin.id === current).spec;
}

$('#skins').addEventListener('click', event => {
  const button = event.target.closest('[data-skin]');
  if (!button) return;
  document.documentElement.dataset.skin = button.dataset.skin;
  try { localStorage.setItem('blinker-ui-skin', button.dataset.skin); } catch (error) { /* 仅为偏好记忆 */ }
  renderSkins();
  renderGallery();
  renderInspector();
});

/* ============ 演示数据心跳 ============ */

let tick = 0;

setInterval(() => {
  tick += 1;
  for (const it of items) {
    const busy = drag?.it === it || it.spec.type === 'text';
    if (it.spec.type === 'timer' && it.value.left > 0) {
      it.value.left -= 1;
      rerender(it);
    } else if (it.spec.live && tick % 3 === 0 && !busy) {
      it.spec.live(it);
      rerender(it);
    }
  }
}, 1000);

/* ============ 启动 ============ */

renderSkins();
renderGallery();
renderInspector();
</script>
