apply plugin: 'com.android.application'

android {
    namespace = "iot.diandeng.tech"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "iot.diandeng.tech"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        beta {
            initWith debug
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            matchingFallbacks = ['debug']
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Beta shares the existing internal debug signer, but not its package/data or
// local CA overlay. Sync the explicit cloud profile before assembling it.
tasks.register('verifyCloudBetaConfig') {
    doLast {
        if (providers.environmentVariable('BLINKER_DEBUG_NETWORK_CONFIG_DIR').isPresent() ||
            providers.environmentVariable('BLINKER_LOCAL_CLEARTEXT').getOrElse('0') == '1') {
            throw new GradleException('Cloud beta forbids local network trust overrides')
        }
        def assets = file('src/main/assets')
        def config = new groovy.json.JsonSlurper().parse(new File(assets, 'capacitor.config.json'))
        def registry = new groovy.json.JsonSlurper().parse(new File(assets, 'capacitor.plugins.json'))
        if (config.appId != 'iot.diandeng.tech.beta' || config.server?.androidScheme != 'https' ||
            config.server?.cleartext != false || config.server?.url || config.loggingBehavior != 'none' ||
            !registry.any { it.pkg == '@aparajita/capacitor-secure-storage' && it.classpath }) {
            throw new GradleException('Run pnpm run sync:cloud-beta before assembling beta')
        }
    }
}
tasks.configureEach {
    if (name == 'preBetaBuild') dependsOn 'verifyCloudBetaConfig'
}

// Optional local hardware CA, supplied outside the repository. Only debug
// consumes this manifest/resource overlay; release never trusts a test CA.
def localNetworkConfig = providers.environmentVariable('BLINKER_DEBUG_NETWORK_CONFIG_DIR').orNull
if (localNetworkConfig) {
    def networkRoot = file(localNetworkConfig)
    if (!new File(networkRoot, 'AndroidManifest.xml').isFile() || !new File(networkRoot, 'res').isDirectory()) {
        throw new GradleException('Invalid BLINKER_DEBUG_NETWORK_CONFIG_DIR')
    }
    android.sourceSets.debug.manifest.srcFile new File(networkRoot, 'AndroidManifest.xml')
    android.sourceSets.debug.res.srcDir new File(networkRoot, 'res')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
