name: Build and deploy web

on:
  push:
    branches:
      - 3.0-deploy
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24.15.0"

jobs:
  build:
    name: Build and deploy web
    if: github.ref == 'refs/heads/3.0-deploy'
    runs-on: [self-hosted, ailydeMac-mini, macOS, ARM64]
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout blinker app
        uses: actions/checkout@v7
        with:
          path: blinker-app
          persist-credentials: false

      # These repositories must be siblings of blinker-app because package.json
      # references them with file:../capacitor-* paths.
      - name: Checkout capacitor-android-shortcuts
        uses: actions/checkout@v7
        with:
          repository: coloz/capacitor-android-shortcuts
          ref: 2c187e447542843dba1264bd95c297686ade6c49
          path: capacitor-android-shortcuts
          token: ${{ secrets.CI_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout capacitor-mdns
        uses: actions/checkout@v7
        with:
          repository: i3water/capacitor-mdns
          ref: 00f994f2896327781c64f93851932f1acbddcb8e
          path: capacitor-mdns
          token: ${{ secrets.CI_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout capacitor-ntfy
        uses: actions/checkout@v7
        with:
          repository: i3water/capacitor-ntfy
          ref: 83b57ee2efdd829db025d37fb898d349e6cd6a35
          path: capacitor-ntfy
          token: ${{ secrets.CI_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout capacitor-wechat
        uses: actions/checkout@v7
        with:
          repository: coloz/capacitor-wechat
          ref: ba0bfc5677b2a0dfe11d231c43b52e07af0bf487
          path: capacitor-wechat
          token: ${{ secrets.CI_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout capacitor-wifiprov
        uses: actions/checkout@v7
        with:
          repository: i3water/capacitor-wifiprov
          ref: a21e87642a853242677f7dccd8847e9785837ab0
          path: capacitor-wifiprov
          token: ${{ secrets.CI_REPOS_TOKEN || github.token }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable the declared package manager
        shell: bash
        run: corepack enable

      - name: Build local Capacitor plugins
        shell: bash
        run: |
          set -euo pipefail
          for plugin in \
            capacitor-android-shortcuts \
            capacitor-mdns \
            capacitor-ntfy \
            capacitor-wechat \
            capacitor-wifiprov
          do
            npm --prefix "$plugin" ci
            npm --prefix "$plugin" run build
          done

      - name: Build web app
        working-directory: blinker-app
        shell: bash
        run: |
          set -euo pipefail
          corepack install
          pnpm install --frozen-lockfile
          pnpm --config.enable-pre-post-scripts=true run build
          test -f www/index.html

      - name: Upload web files
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          source: "blinker-app/www/*"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 2
          overwrite: true
          rm: false
